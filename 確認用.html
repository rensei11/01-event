<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>見やすさ確認版</title>
<style>
:root{--bg:#f4f6f8;--paper:#fff;--panel:#fff;--line:#d6dce2;--head:#20262d;--text:#1d2329;--muted:#606a74;--week:#e8edf2;--link:#0b57d0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Meiryo",sans-serif;line-height:1.55}
.wrap{max-width:1320px;margin:0 auto;padding:18px}
h1{font-size:20px;margin:0}.sub{margin:3px 0 12px;color:var(--muted);font-size:12px}
.controls{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap;align-items:center}
.legacy-edit-toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 6px}.legacy-edit-toolbar button:disabled{opacity:.45;cursor:not-allowed}.legacy-edit-toolbar .primary{font-weight:800}.legacy-edit-toolbar .danger{color:#9a3412;border-color:#d8a58d}.edit-help{font-size:12px;color:var(--muted);margin:0 0 10px}
.event-row.selected td,.week.selected td{box-shadow:inset 0 0 0 2px #d29b00!important}
body.editing .event-row td{background:#fffdf2!important;outline:none} body.editing .event-row .date{cursor:text}
body.editing .week td{outline:none}
body.editing .event-row.selected td{background:#fff4c7!important}.edit-mode-btn{margin-left:4px}.row-edit-btn{display:none}
.edit-bar{display:none!important}.edit-change-count{font-size:12px;font-weight:900;color:#374151;margin-left:auto}.edit-save{background:#20262d;color:#fff;border-color:#20262d}.edit-hint{font-size:11px;color:#606a74}
.editable{outline:0}.editing .editable{cursor:text;border-radius:4px;box-shadow:inset 0 0 0 1px #b9c7d4;background:#fffdf4;padding:1px 3px}.editing .editable:focus{box-shadow:inset 0 0 0 2px #5d8fc5;background:#fff}.editing .editable-block{display:block;min-height:20px}.editing .edit-delete-btn{display:inline-block}.edit-delete-btn{display:none;margin-left:6px;padding:2px 7px;font-size:11px;color:#9a3412;border-color:#d8a58d}.edit-mode-note{font-size:12px;font-weight:800;color:#374151}
button{border:1px solid #aeb7c0;background:#fff;border-radius:7px;padding:7px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
button.active{background:#20262d;color:#fff;border-color:#20262d}
.status{margin-left:auto;align-self:center;font-size:12px;color:var(--muted)}
.calendar-panel{margin:0 0 14px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px 12px}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.calendar-title{font-size:14px;font-weight:900}.calendar-note{font-size:12px;color:var(--muted)}
.calendar-jump{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}.list-filter-bar{display:flex;align-items:center;gap:7px;margin:0 0 8px;font-size:12px;font-weight:800;color:#555}.list-filter-bar select{border:1px solid #aeb7c0;border-radius:7px;background:#fff;padding:5px 8px;font:inherit;font-size:12px}.calendar-start-label{font-size:12px;font-weight:900;color:#555}.calendar-year{border:1px solid #b9b9b4;border-radius:6px;background:#fff;padding:5px 7px;font:inherit;font-size:12px;font-weight:800}.month-jump{display:flex;gap:3px;flex-wrap:wrap}.month-jump button{min-width:35px;padding:4px 6px;font-size:11px}.month-jump button.active{background:#41474c;color:#fff;border-color:#41474c}
.calendar-slider{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:7px;align-items:stretch}.calendar-arrow{align-self:stretch;min-width:34px;padding:0 7px;font-size:23px;font-weight:900}.calendars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}.month-card{border:1px solid #e1e3e3;border-radius:7px;padding:7px 8px 8px;min-width:0;align-self:start}.month-name{text-align:center;font-size:13px;font-weight:900;margin-bottom:4px;cursor:pointer}.month-name:hover{text-decoration:underline}.month-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:26px;column-gap:2px;row-gap:2px;align-content:start;text-align:center;font-size:11px}.weekday{color:var(--muted);font-weight:800;padding:2px 0}.cal-day{position:relative;width:26px;height:26px;justify-self:center;display:flex;align-items:center;justify-content:center;border-radius:50%;user-select:none}.cal-day.empty{visibility:hidden}.cal-day.has-event{background:#8d969d;color:#fff;font-weight:900;cursor:pointer}.cal-day.has-plan{background:#5d8fc5;color:#fff;font-weight:900;cursor:pointer}.cal-day.has-attended{background:#4f7c6e;color:#fff;font-weight:900;cursor:pointer}.cal-day.today::after{content:"";position:absolute;inset:1px;border:2px solid #111;border-radius:50%;pointer-events:none}.cal-day.clickable:hover{filter:brightness(.92)}
.calendar-focus td{animation:calFlash 1.2s ease}@keyframes calFlash{0%,100%{background:inherit}35%,70%{background:#fff1b8}}
.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;box-shadow:0 1px 4px rgba(0,0,0,.04)}
table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:840px}
col.date{width:9%}col.event{width:29%}col.cond{width:19%}col.detail{width:43%}col.attended-date-col{width:10%}col.attended-event-col{width:35%}col.attended-detail-col{width:55%}
th{position:sticky;top:0;z-index:2;background:var(--head);color:#fff;text-align:left;font-size:14px;padding:10px 12px;border-right:1px solid #3d4650}
td{vertical-align:top;padding:10px 12px;border-top:1px solid var(--line);border-right:1px solid var(--line);font-size:14px}
th:last-child,td:last-child{border-right:0}
.month td{background:#d7e2ee;font-weight:800;font-size:15px;padding:8px 12px;border-top:3px solid #8fa2b5}.week td{background:var(--week);font-weight:700;font-size:14px;padding:7px 12px;border-top:2px solid #aeb8c2;color:var(--text)}
.event-row:nth-of-type(even) td{background:#fdfdfc}
.date,.date-head{text-align:center}.date{font-weight:700;white-space:normal;vertical-align:middle;font-size:12px;line-height:1.35;padding-left:6px;padding-right:6px;overflow:hidden}
.event-meta-line{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;min-height:20px}.event-right-tools{margin-left:auto;display:flex;align-items:center;gap:7px}.event-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 0 5px}.event-tools label{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:#555}.event-tools input{margin:0}.plan-days{display:flex;gap:5px;flex-wrap:wrap;margin:-1px 0 5px 2px}.plan-days label{display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border:1px solid #c5c9cc;border-radius:9px;background:#fff;font-size:10px;font-weight:800;color:#555}.plan-days input{margin:0}.event-badges{display:flex;gap:5px;flex-wrap:wrap}.kind-badge,.tag{display:inline-block;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:800}.kind-badge{color:#fff}.kind-badge.exhibition{background:#166534}.kind-badge.gathering{background:#9a3412}.person-top{text-align:right;font-size:12px;font-weight:800;color:#46515c;white-space:nowrap;margin-left:auto}.event-head{display:block}.name{font-weight:700;font-size:15px}.name a{color:var(--link);text-decoration:none}.name a:hover{text-decoration:underline}
.venue{margin-top:2px;color:var(--muted)}
.person{font-weight:800;margin-bottom:3px}.condline{margin:1px 0}.report-cond{margin:0 0 7px;padding:5px 7px;background:#f6f6f3;border-left:3px solid #c5c5bf;color:#555}.report-cond div{margin:1px 0}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.tag{border:1px solid #c8c8c2;background:#fff}
.attended{border-color:#8eb8ac;color:#246355;background:#f1f8f5}
.planned{border-color:#b8cbe2;color:#315d87;background:#f7fbff}
.notattended{border-color:#c9c9c5;color:#73736e;background:#f6f6f4}
.row-planned td:first-child{box-shadow:inset 4px 0 0 #b9d2ea}.planned-view .month td,.planned-view .week td{box-shadow:inset 4px 0 0 #b9d2ea}.attended-date{background:#f2f6f3!important;font-size:18px;overflow:hidden}.visit-count{margin-top:4px;font-size:12px;font-weight:900;color:#4f6b60}.attended-day-row td{border-top-color:#d8ddda}.attended-day-start td{border-top:2px solid #bfc7c2!important}.report-days{font-size:12px;font-weight:800;color:#5f6a64;margin:0 0 5px}.report-reference{font-size:12px;color:#7a7a74;padding:4px 0}
.row-notattended td{color:#777772;background:#f4f4f2!important}.row-ignored td{background:#ececea!important}.row-ignored td,.row-ignored td *:not(.kind-badge):not(.tag){color:#858581!important}.row-ignored .kind-badge,.row-ignored .tag{filter:none!important}
.rating{font-weight:900;margin-bottom:3px}.report{white-space:pre-wrap}.pre{color:#555;margin-bottom:5px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:700px){.wrap{padding:10px}h1{font-size:17px}td,th{padding:6px 8px}.status{width:100%;margin-left:0}.calendars{grid-template-columns:repeat(3,minmax(220px,1fr));overflow-x:auto}.calendar-slider{overflow:hidden}}
</style>
</head>
<body>
<div class="wrap">
  <h1>無料食事イベント台帳　見やすさ確認版</h1>
  <div class="sub">本番画面とは別です。1イベントを1行にまとめ、見ることだけに絞っています。</div>
  <div class="controls">
    <button data-mode="all" class="active">すべて</button>
    <button data-mode="planned">来場予定</button>
    <button data-mode="attended">参加済み</button>
    <span id="status" class="status">読み込み中</span>
  </div>
  <div class="legacy-edit-toolbar">
    <button id="editBtn" class="primary" type="button">編集開始</button>
    <button id="addBtn" type="button" disabled>＋ 新しいイベント</button>
    <button id="moveUpBtn" type="button" disabled>↑ 上へ</button>
    <button id="moveDownBtn" type="button" disabled>↓ 下へ</button>
    <button id="kindBtn" type="button" disabled>展示会／懇親会</button>
    <button id="linkBtn" type="button" disabled>リンク設定</button>
    <button id="addWeekBtn" type="button" disabled>週区切りを追加</button>
    <button id="delBtn" class="danger" type="button" disabled>選択行を削除</button>
    <button id="saveHtmlBtn" type="button">HTMLを保存</button>
    <button id="resetHtmlBtn" type="button">編集内容を戻す</button>
  </div>
  <div class="edit-help">編集開始 → 表の文字を直接変更できます。行をクリックすると黄色く選択され、↑↓・分類・リンク・削除が使えます。</div>
  <section class="calendar-panel" aria-label="カレンダー">
    <div class="calendar-head"><div class="calendar-title">カレンダー</div><div id="calendarNote" class="calendar-note"></div></div>
    <div class="calendar-jump"><span class="calendar-start-label">カレンダー表示月</span><select id="calendarYear" class="calendar-year" aria-label="年"></select><div id="monthJump" class="month-jump"></div></div>
    <div class="calendar-slider"><button id="calendarPrev" class="calendar-arrow" type="button" aria-label="前の月">‹</button><div id="calendarMonths" class="calendars"></div><button id="calendarNext" class="calendar-arrow" type="button" aria-label="次の月">›</button></div>
  </section>
  <div class="list-filter-bar"><span>一覧表示</span><select id="listStartSelect"><option value="0">全期間</option><option value="1">1月以降</option><option value="2">2月以降</option><option value="3">3月以降</option><option value="4">4月以降</option><option value="5">5月以降</option><option value="6">6月以降</option><option value="7">7月以降</option><option value="8">8月以降</option><option value="9">9月以降</option><option value="10">10月以降</option><option value="11">11月以降</option><option value="12">12月以降</option></select></div>
  <div class="table-wrap">
    <table id="ledgerTable">
      <colgroup id="ledgerCols"><col class="date"><col class="event"><col class="cond"><col class="detail"></colgroup>
      <thead id="ledgerHead"><tr><th class="date-head">日付</th><th>イベント / 会場</th><th>参加条件</th><th>評価 / 内容</th></tr></thead>
      <tbody id="body"><tr><td colspan="4" class="empty">読み込み中です</td></tr></tbody>
    </table>
  </div>
  <div class="note">※ 初期版と同じHTML直接編集方式です。保存先はこの確認版のブラウザ内で、本番GitHubにはまだ反映しません。</div>
</div>
<script>
const FLAGS_KEY='free_food_event_ledger_2026_flags_v2';
const EDIT_DRAFT_KEY='free_food_event_ledger_2026_design_edit_v1';
const LEGACY_HTML_KEY='free_food_event_ledger_2026_legacy_html_v1';
let events=[],reports=[],flags={},mode='all',editing=false;
let baseEvents=[],baseReports=[],dirtyIds=new Set(),activeEditId='',activeEditVisitDate='';
let selected=null;
const calendarToday=new Date();
let calendarBaseYear=calendarToday.getFullYear(),calendarBaseMonth=calendarToday.getMonth()+1;
let listStartYear=0,listStartMonth=0;

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').toLowerCase().replace(/[\s　・･｜|™®【】\[\]（）()‐\-–—'’:"：～〜]/g,'')}
function days(a,b){const out=[],x=new Date(a+'T00:00:00'),y=new Date((b||a)+'T00:00:00');for(let d=new Date(x);d<=y;d.setDate(d.getDate()+1))out.push(d.toISOString().slice(0,10));return out}
function inRange(e,d){return d>=e.date&&d<=(e.endDate||e.date)}
function flag(e){return flags[e.id]||{}}
function saveFlags(){
  localStorage.setItem(FLAGS_KEY,JSON.stringify(flags));
}
function setPlan(e,checked){
  const f=flags[e.id]||{};
  if(checked){
    f.ignored=false;
    if(e.endDate&&e.endDate!==e.date){
      if(!Array.isArray(f.visitDates)||!f.visitDates.length)f.visitDates=[e.date];
      f.planned=true;
    }else{
      f.planned=true;
      delete f.visitDates;
    }
  }else{
    f.planned=false;
    if(Array.isArray(f.visitDates))delete f.visitDates;
  }
  flags[e.id]=f;saveFlags();render();
}
function setPlanDay(e,date,checked){
  const f=flags[e.id]||{};
  const set=new Set(Array.isArray(f.visitDates)?f.visitDates:[]);
  if(checked)set.add(date);else set.delete(date);
  f.visitDates=[...set].filter(d=>inRange(e,d)).sort();
  f.planned=f.visitDates.length>0;
  if(f.planned)f.ignored=false;
  flags[e.id]=f;saveFlags();render();
}
function setIgnore(e,checked){
  const f=flags[e.id]||{};
  f.ignored=checked;
  if(checked){f.planned=false;if(Array.isArray(f.visitDates))delete f.visitDates;}
  flags[e.id]=f;saveFlags();render();
}
function actualDates(e){return Array.isArray(e.visitDates)?e.visitDates:[]}
function plannedDates(e){
  const f=flag(e); let x=[];
  if(Array.isArray(f.visitDates))x=[...new Set(f.visitDates)].filter(d=>inRange(e,d));
  else if(f.planned)x=[e.date];
  const done=new Set(actualDates(e));
  return x.filter(d=>!done.has(d)).sort();
}
function dateText(e){
  if(e.dateText)return e.dateText.replace(/\t/g,' ').trim();
  return e.endDate&&e.endDate!==e.date ? e.date+'～'+e.endDate : e.date;
}
function compactRangeText(e){
  const a=new Date(e.date+'T00:00:00'),b=new Date((e.endDate||e.date)+'T00:00:00');
  const w=['日','月','火','水','木','金','土'];
  const left=(a.getMonth()+1)+'/'+a.getDate()+'('+w[a.getDay()]+')';
  if(!e.endDate||e.endDate===e.date)return left;
  const sameMonth=a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth();
  const right=(sameMonth?'':(b.getMonth()+1)+'/')+b.getDate()+'('+w[b.getDay()]+')';
  return left+'～'+right;
}

function planDayChecks(e){
  if(!e.endDate||e.endDate===e.date)return '';
  const selected=new Set(plannedDates(e));
  const w=['日','月','火','水','木','金','土'];
  return '<div class="plan-days">'+days(e.date,e.endDate).map(d=>{
    const x=new Date(d+'T00:00:00');
    return '<label><input class="plan-day-toggle" type="checkbox" data-id="'+esc(e.id)+'" data-day="'+esc(d)+'" '+(selected.has(d)?'checked':'')+'>'+x.getDate()+'('+w[x.getDay()]+')</label>';
  }).join('')+'</div>';
}

function personLines(e){return (e.conditionLines||[]).filter(x=>String(x).startsWith('名前コード：')).map(x=>String(x).replace(/^名前コード：/,'').trim())}
function conditionLines(e){return (e.conditionLines||[]).filter(x=>!String(x).startsWith('名前コード：'))}
function reportFor(e){
  if(e.sourceReportId){const x=reports.find(r=>r.id===e.sourceReportId);if(x)return x}
  const nn=norm(e.name);
  return reports.find(r=>norm(r.name)===nn && (r.scheduledDate===e.date || inRange(e,r.date))) || null;
}
function fmtDates(xs){return xs.map(x=>{const d=new Date(x+'T00:00:00');return (d.getMonth()+1)+'/'+d.getDate()}).join('・')}
function weekKey(iso){const d=new Date(iso+'T00:00:00'),n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}
function weekLabel(iso){const d=new Date(iso+'T00:00:00'),n=(d.getDay()+6)%7;const m=new Date(d);m.setDate(d.getDate()-n);const su=new Date(m);su.setDate(m.getDate()+6);return (m.getMonth()+1)+'/'+m.getDate()+'～'+(su.getMonth()+1)+'/'+su.getDate()}



function cloneData(v){return JSON.parse(JSON.stringify(v))}
function eventById(id){return events.find(e=>e.id===id)||null}
function baseEventById(id){return baseEvents.find(e=>e.id===id)||null}
function reportByEvent(e){return e?reportFor(e):null}
function refreshEditBar(){
  const n=document.getElementById('editChangeCount');
  if(n)n.textContent='変更 '+dirtyIds.size+'件';
}
function markDirty(id){dirtyIds.add(id);refreshEditBar()}
function splitLines(v){return String(v||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}
function editRowHtml(e,r,colspan,visitDate){
  const people=personLines(e).join('\n');
  const cond=conditionLines(e).join('\n');
  const visits=actualDates(e).join(', ');
  const kind=e._kind==='gathering'?'gathering':'exhibition';
  const status=e.attendanceStatus||'';
  return '<tr class="inline-edit-row" data-editor-id="'+esc(e.id)+'"><td colspan="'+colspan+'"><div class="edit-panel">'+
    '<div class="edit-field"><label>区分</label><select data-f="kind"><option value="exhibition" '+(kind==='exhibition'?'selected':'')+'>展示会</option><option value="gathering" '+(kind==='gathering'?'selected':'')+'>懇親会</option></select></div>'+
    '<div class="edit-field"><label>開始日</label><input data-f="date" type="date" value="'+esc(e.date||'')+'"></div>'+
    '<div class="edit-field"><label>終了日</label><input data-f="endDate" type="date" value="'+esc(e.endDate||'')+'"></div>'+
    '<div class="edit-field"><label>参加状態</label><select data-f="attendanceStatus"><option value="" '+(!status?'selected':'')+'>未確定</option><option value="attended" '+(status==='attended'?'selected':'')+'>参加済み</option><option value="not_attended" '+(status==='not_attended'?'selected':'')+'>未参加</option></select></div>'+
    '<div class="edit-field wide"><label>イベント名</label><input data-f="name" value="'+esc(e.name||'')+'"></div>'+
    '<div class="edit-field wide"><label>会場</label><input data-f="venue" value="'+esc(e.venue||'')+'"></div>'+
    '<div class="edit-field full"><label>URL</label><input data-f="url" value="'+esc(e.url||'')+'"></div>'+
    '<div class="edit-field wide"><label>名前</label><textarea data-f="people">'+esc(people)+'</textarea></div>'+
    '<div class="edit-field wide"><label>参加条件（1行ずつ）</label><textarea data-f="conditions">'+esc(cond)+'</textarea></div>'+
    '<div class="edit-field"><label>事前評価</label><input data-f="rating" value="'+esc(e.rating||'')+'"></div>'+
    '<div class="edit-field"><label>夜の時間</label><input data-f="nightTime" value="'+esc(e.nightTime||'')+'"></div>'+
    '<div class="edit-field wide"><label>夜の内容</label><textarea data-f="nightText">'+esc(e.nightText||'')+'</textarea></div>'+
    '<div class="edit-field full"><label>実際に参加した日（カンマ区切り）</label><input data-f="visitDates" value="'+esc(visits)+'" placeholder="2026-04-15, 2026-04-16"></div>'+
    '<div class="edit-field"><label>実地レポート 評価</label><input data-f="reportRating" value="'+esc(r?.rating||'')+'"></div>'+
    '<div class="edit-field full"><label>実地レポート</label><textarea class="report-editor" data-f="reportText">'+esc(r?.report||'')+'</textarea></div>'+
    '<div class="edit-actions">'+
      '<button type="button" class="apply-row-edit" data-id="'+esc(e.id)+'">この内容を反映</button>'+
      '<button type="button" class="undo-row-edit" data-id="'+esc(e.id)+'">このイベントを元に戻す</button>'+
      '<button type="button" class="duplicate-row-edit" data-id="'+esc(e.id)+'">複製</button>'+
      '<button type="button" class="delete-row-edit edit-danger" data-id="'+esc(e.id)+'">削除</button>'+

function calendarMap(){

function availableYears(){
  const ys=new Set([calendarToday.getFullYear()]);
  for(const e of events){
    if(e.date)ys.add(Number(e.date.slice(0,4)));
    if(e.endDate)ys.add(Number(e.endDate.slice(0,4)));
    for(const d of actualDates(e))ys.add(Number(d.slice(0,4)));
    for(const d of plannedDates(e))ys.add(Number(d.slice(0,4)));
  }
  return [...ys].filter(Number.isFinite).sort((a,b)=>a-b);
}
function buildMonthCard(year,month,map){
  const card=document.createElement('div');card.className='month-card';
  const title=document.createElement('div');title.className='month-name';title.textContent=year+'年'+month+'月';title.title=year+'年'+month+'月の一覧へ移動';title.onclick=()=>jumpToMonth(year,month);card.appendChild(title);
  const grid=document.createElement('div');grid.className='month-grid';
  ['日','月','火','水','木','金','土'].forEach(w=>{const x=document.createElement('div');x.className='weekday';x.textContent=w;grid.appendChild(x)});
  const first=new Date(year,month-1,1),last=new Date(year,month,0).getDate();
  for(let i=0;i<first.getDay();i++){const x=document.createElement('div');x.className='cal-day empty';grid.appendChild(x)}
  for(let d=1;d<=last;d++){
    const key=isoDate(year,month,d),x=document.createElement('div');x.className='cal-day';x.textContent=d;
    if(map.has(key)){
      x.classList.add(mode==='attended'?'has-attended':mode==='planned'?'has-plan':'has-event','clickable');
      x.title=(mode==='attended'?'参加済み ':mode==='planned'?'来場予定 ':'イベント ')+map.get(key)+'件';
      x.onclick=()=>jumpToDate(key);
    }
    if(year===calendarToday.getFullYear()&&month===calendarToday.getMonth()+1&&d===calendarToday.getDate())x.classList.add('today');
    grid.appendChild(x);
  }
  card.appendChild(grid);return card;
}

function venueSortKey(e){
  const v=String(e.venue||'').replace(/\s+/g,' ').trim();
  const isBigSight=/ビッ?クサイト|東京ビッグサイト/.test(v);
  if(isBigSight){
    const areas=[['東',0],['西',1],['南',2]];
    for(const [label,rank] of areas){
      const m=v.match(new RegExp(label+'\\s*(\\d+)'));
      if(m)return [0,rank,Number(m[1]),v];
    }
    return [0,9,999,v];
  }
  return [1,0,0,v];
}
function compareVenue(a,b){
  const kindA=a._kind==='gathering'?1:0,kindB=b._kind==='gathering'?1:0;
  if(kindA!==kindB)return kindA-kindB;
  const x=venueSortKey(a),y=venueSortKey(b);
  for(let i=0;i<3;i++){if(x[i]!==y[i])return x[i]-y[i];}
  const vd=String(x[3]).localeCompare(String(y[3]),'ja',{numeric:true});
  if(vd)return vd;
  return String(a.name||'').localeCompare(String(b.name||''),'ja',{numeric:true});
}

}

function render(){
  const listSel=document.getElementById('listStartSelect');if(listSel)listSel.value=String(listStartMonth||0);
  document.body.classList.toggle('planned-view',mode==='planned');
  document.body.classList.toggle('editing',editing);
  refreshEditBar();
  setTableLayout(mode==='attended');

  if(mode==='attended'){
    const items=[];
    for(const e of events){
      if(e.attendanceStatus!=='attended')continue;
      for(const d of actualDates(e)){
        if(passesListStart(d))items.push({e,d});
      }
    }
    items.sort((a,b)=>a.d.localeCompare(b.d)||compareVenue(a.e,b.e));
    let html='',month='',week='',i=0;
    while(i<items.length){
      const d=items[i].d,m=d.slice(0,7),w=weekKey(d);
      if(m!==month){
        const [y,mm]=m.split('-');
        html+='<tr class="month" data-month="'+esc(m)+'"><td colspan="3">'+esc(y)+'年'+Number(mm)+'月</td></tr>';
        month=m;week='';
      }
      if(w!==week){
        html+='<tr class="week"><td colspan="3">'+esc(weekLabel(d))+'</td></tr>';
        week=w;
      }
      const same=[];
      while(i<items.length&&items[i].d===d){same.push(items[i]);i++;}
      same.forEach((x,idx)=>{html+=attendedRow(x.e,d,idx===0,same.length,idx===0);});
    }
    document.getElementById('body').innerHTML=html||'<tr><td colspan="3" class="empty">参加済みイベントはありません</td></tr>';
    restoreLegacyHTML();applyContentEditable();selected=null;updateEditButtons();
    document.getElementById('status').textContent=items.length+'件';
    renderCalendar();
    return;
  }

  let list=events.slice();
  if(mode==='planned')list=list.filter(e=>plannedDates(e).length);
  list=list.filter(e=>passesListStart(listDateForEvent(e)));
  list.sort((a,b)=>listDateForEvent(a).localeCompare(listDateForEvent(b))||compareVenue(a,b));

  let html='',month='',week='';
  for(const e of list){
    const d=listDateForEvent(e),m=d.slice(0,7),w=weekKey(d);
    if(m!==month){
      const [y,mm]=m.split('-');
      html+='<tr class="month" data-month="'+esc(m)+'"><td colspan="4">'+esc(y)+'年'+Number(mm)+'月</td></tr>';
      month=m;week='';
    }
    if(w!==week){
      html+='<tr class="week"><td colspan="4">'+esc(weekLabel(d))+'</td></tr>';
      week=w;
    }
    html+=row(e);
  }
  document.getElementById('body').innerHTML=html||'<tr><td colspan="4" class="empty">該当するイベントはありません</td></tr>';
  restoreLegacyHTML();applyContentEditable();selected=null;updateEditButtons();
  document.getElementById('status').textContent=list.length+'件';
  renderCalendar();
}

document.querySelector('.controls').addEventListener('click',e=>{
  const b=e.target.closest('button[data-mode]');if(!b)return;
  if(editing)saveLegacyHTML();
  mode=b.dataset.mode;
  selected=null;
  document.querySelectorAll('button[data-mode]').forEach(x=>x.classList.toggle('active',x===b));
  render();
});

document.getElementById('editBtn').addEventListener('click',()=>setLegacyEditing(!editing));

document.getElementById('body').addEventListener('click',e=>{
  if(!editing)return;
  if(e.target.closest('input,button'))return;
  const row=e.target.closest('tr');
  if(!row)return;
  if(e.target.closest('a'))e.preventDefault();
  setSelected(row);
});

document.getElementById('body').addEventListener('input',()=>{
  if(!editing)return;
  clearTimeout(window.__legacySaveTimer);
  window.__legacySaveTimer=setTimeout(()=>saveLegacyHTML('編集中（自動保存）'),250);
});

document.getElementById('addBtn').addEventListener('click',()=>{
  if(!editing)return;
  const colspan=mode==='attended'?3:4;
  const tr=document.createElement('tr');
  tr.className='event-row';
  tr.dataset.eventId='manual-'+Date.now();
  if(colspan===4){
    tr.innerHTML='<td class="date"></td><td><div class="event-meta-line"><div class="event-badges"><span class="kind-badge exhibition">展示会</span></div></div><div class="event-name"></div><div class="venue"></div></td><td></td><td></td>';
  }else{
    tr.innerHTML='<td class="date"></td><td><div class="event-meta-line"><div class="event-badges"><span class="kind-badge exhibition">展示会</span></div></div><div class="event-name"></div><div class="venue"></div></td><td></td>';
  }
  if(selected)selected.insertAdjacentElement('afterend',tr);
  else document.getElementById('body').appendChild(tr);
  tr.querySelectorAll('td').forEach(td=>td.contentEditable='true');
  setSelected(tr);
  saveLegacyHTML('新しいイベントを追加しました');
  tr.scrollIntoView({behavior:'smooth',block:'center'});
  const name=tr.querySelector('.event-name');if(name)name.focus();
});

document.getElementById('moveUpBtn').addEventListener('click',()=>{
  if(!editing||!selected||!selected.classList.contains('event-row'))return;
  let prev=selected.previousElementSibling;
  while(prev&&prev.classList.contains('month'))prev=prev.previousElementSibling;
  if(prev){prev.insertAdjacentElement('beforebegin',selected);saveLegacyHTML('行を上へ移動しました');}
});
document.getElementById('moveDownBtn').addEventListener('click',()=>{
  if(!editing||!selected||!selected.classList.contains('event-row'))return;
  let next=selected.nextElementSibling;
  while(next&&next.classList.contains('month'))next=next.nextElementSibling;
  if(next){next.insertAdjacentElement('afterend',selected);saveLegacyHTML('行を下へ移動しました');}
});
document.getElementById('kindBtn').addEventListener('click',()=>{
  if(!editing||!selected||!selected.classList.contains('event-row'))return;
  let badge=selected.querySelector('.kind-badge');
  if(!badge){
    const box=selected.querySelector('.event-badges')||selected.querySelector('td:nth-child(2)');
    badge=document.createElement('span');badge.className='kind-badge exhibition';badge.textContent='展示会';
    box.prepend(badge);
  }else if(badge.classList.contains('exhibition')){
    badge.classList.remove('exhibition');badge.classList.add('gathering');badge.textContent='懇親会';
  }else{
    badge.classList.remove('gathering');badge.classList.add('exhibition');badge.textContent='展示会';
  }
  saveLegacyHTML('分類を変更しました');
});

document.getElementById('addWeekBtn').addEventListener('click',()=>{
  if(!editing||!selected)return;
  const colspan=mode==='attended'?3:4;
  const tr=document.createElement('tr');
  tr.className='week';
  tr.innerHTML='<td colspan="'+colspan+'" data-manual-week="1" contenteditable="true">週区切り</td>';
  selected.insertAdjacentElement('afterend',tr);
  setSelected(tr);
  saveLegacyHTML('週区切りを追加しました');
});

document.getElementById('delBtn').addEventListener('click',()=>{
  if(!editing||!selected||!selected.classList.contains('event-row'))return;
  const name=selected.querySelector('.event-name,.name')?.innerText?.trim()||'この行';
  if(!confirm('「'+name+'」を削除しますか？'))return;
  selected.remove();selected=null;updateEditButtons();saveLegacyHTML('削除しました');
});

document.getElementById('linkBtn').addEventListener('click',()=>{
  if(!editing||!selected||!selected.classList.contains('event-row'))return;
  let name=selected.querySelector('.event-name,.name');
  if(!name)return;
  let a=name.querySelector('a');
  const current=a?.getAttribute('href')||'';
  const url=prompt('このイベントのURLを貼り付けてください',current);
  if(url===null)return;
  const text=(a?a.textContent:name.textContent).trim()||'イベント名';
  if(!url.trim()){
    name.textContent=text;
  }else{
    name.innerHTML='<a href="'+esc(url.trim())+'" target="_blank" rel="noopener">'+esc(text)+'</a>';
  }
  saveLegacyHTML('リンクを設定しました');
});

document.getElementById('saveHtmlBtn').addEventListener('click',()=>{
  saveLegacyHTML('このブラウザにHTMLを保存しました（本番未反映）');
});

document.getElementById('resetHtmlBtn').addEventListener('click',()=>{
  if(confirm('この画面で行ったHTML編集を元に戻しますか？'))clearLegacyHTML();
});

document.getElementById('body').addEventListener('change',e=>{
  const p=e.target.closest('.plan-toggle'),n=e.target.closest('.ignore-toggle'),d=e.target.closest('.plan-day-toggle');
  if(!p&&!n&&!d)return;
  const id=(p||n||d).dataset.id,event=events.find(x=>x.id===id);
  if(!event)return;
  if(p)setPlan(event,p.checked);
  if(n)setIgnore(event,n.checked);
  if(d)setPlanDay(event,d.dataset.day,d.checked);
});

document.getElementById('calendarPrev').onclick=()=>setCalendarBase(calendarBaseYear,calendarBaseMonth-1);
document.getElementById('calendarNext').onclick=()=>setCalendarBase(calendarBaseYear,calendarBaseMonth+1);
document.getElementById('calendarYear').addEventListener('change',e=>{
  const y=Number(e.target.value);
  setCalendarBase(y,calendarBaseMonth);
});
document.getElementById('monthJump').addEventListener('click',e=>{
  const b=e.target.closest('button[data-month]');if(!b)return;
  const m=Number(b.dataset.month),y=Number(document.getElementById('calendarYear').value||calendarBaseYear);
  setCalendarBase(y,m);
});
document.getElementById('listStartSelect').addEventListener('change',e=>{
  listStartMonth=Number(e.target.value)||0;
  listStartYear=listStartMonth?calendarBaseYear:0;
  render();
});

(async()=>{
  try{
    try{flags=JSON.parse(localStorage.getItem(FLAGS_KEY)||'{}')}catch(_){flags={}}
    const [g,x,m]=await Promise.all([
      fetch('イベント一覧.json?v='+Date.now(),{cache:'no-store'}),
      fetch('展示会一覧.json?v='+Date.now(),{cache:'no-store'}),
      fetch('実地レポート.json?v='+Date.now(),{cache:'no-store'})
    ]);
    const [gj,xj,mj]=await Promise.all([g.json(),x.json(),m.json()]);
    events=[...(gj.events||[]).map(e=>({...e,_kind:'gathering'})),...(xj.events||[]).map(e=>({...e,_kind:'exhibition'}))];
    const files=(mj.reportFiles&&mj.reportFiles.length)?mj.reportFiles:['実地レポート/2026-01-03.json','実地レポート/2026-04.json','実地レポート/2026-05.json','実地レポート/2026-06.json','実地レポート/2026-07.json','実地レポート/2026-08.json','実地レポート/2026-09.json'];
    const parts=await Promise.all(files.map(async p=>(await fetch(p+'?v='+Date.now(),{cache:'no-store'})).json()));
    reports=parts.flatMap(x=>x.reports||[]);
    try{
      const saved=JSON.parse(localStorage.getItem(EDIT_DRAFT_KEY)||'null');
      if(saved&&Array.isArray(saved.events)&&Array.isArray(saved.reports)){
        events=saved.events;reports=saved.reports;
      }
    }catch(_){}
    baseEvents=cloneData(events);baseReports=cloneData(reports);
    refreshEditBar();
    render();
  }catch(err){
    console.error(err);
    document.getElementById('body').innerHTML='<tr><td colspan="4" class="empty">読み込みに失敗しました</td></tr>';
    document.getElementById('status').textContent='読み込み失敗';
  }
})();
</script>
