<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>見やすさ確認版</title>
<style>
:root{--bg:#f7f7f5;--paper:#fff;--line:#d8d8d3;--text:#252525;--muted:#6d6d68;--head:#3f4448}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Meiryo",sans-serif;line-height:1.45}
.wrap{max-width:1420px;margin:auto;padding:16px}
h1{font-size:20px;margin:0}.sub{margin:3px 0 12px;color:var(--muted);font-size:12px}
.controls{display:flex;gap:7px;margin:0 0 10px;flex-wrap:wrap}
button{border:1px solid #b9b9b4;background:#fff;border-radius:6px;padding:7px 15px;font:inherit;font-weight:700;cursor:pointer}
button.active{background:#41474c;color:white;border-color:#41474c}
.status{margin-left:auto;align-self:center;font-size:12px;color:var(--muted)}
.calendar-panel{margin:0 0 14px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px 12px}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.calendar-title{font-size:14px;font-weight:900}.calendar-note{font-size:12px;color:var(--muted)}
.calendar-jump{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}.calendar-year{border:1px solid #b9b9b4;border-radius:6px;background:#fff;padding:5px 7px;font:inherit;font-size:12px;font-weight:800}.month-jump{display:flex;gap:3px;flex-wrap:wrap}.month-jump button{min-width:35px;padding:4px 6px;font-size:11px}.month-jump button.active{background:#41474c;color:#fff;border-color:#41474c}
.calendar-slider{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:7px;align-items:stretch}.calendar-arrow{align-self:stretch;min-width:34px;padding:0 7px;font-size:23px;font-weight:900}.calendars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.month-card{border:1px solid #e1e3e3;border-radius:7px;padding:7px 8px 8px;min-width:0}.month-name{text-align:center;font-size:13px;font-weight:900;margin-bottom:4px}.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11px}.weekday{color:var(--muted);font-weight:800;padding:2px 0}.cal-day{position:relative;width:26px;height:26px;justify-self:center;display:flex;align-items:center;justify-content:center;border-radius:50%;user-select:none}.cal-day.empty{visibility:hidden}.cal-day.has-event{background:#8d969d;color:#fff;font-weight:900;cursor:pointer}.cal-day.has-plan{background:#5d8fc5;color:#fff;font-weight:900;cursor:pointer}.cal-day.has-attended{background:#4f7c6e;color:#fff;font-weight:900;cursor:pointer}.cal-day.today::after{content:"";position:absolute;inset:1px;border:2px solid #111;border-radius:50%;pointer-events:none}.cal-day.clickable:hover{filter:brightness(.92)}
.calendar-focus td{animation:calFlash 1.2s ease}@keyframes calFlash{0%,100%{background:inherit}35%,70%{background:#fff1b8}}
.table-wrap{background:var(--paper);border:1px solid var(--line);overflow:auto}
table{border-collapse:collapse;width:100%;table-layout:fixed;min-width:940px}
col.date{width:11%}col.event{width:32%}col.detail{width:57%}
th{position:sticky;top:0;z-index:2;background:var(--head);color:#fff;text-align:left;padding:8px 10px;font-size:13px;border-right:1px solid #5a6065}
td{vertical-align:top;padding:7px 10px;border-top:1px solid var(--line);border-right:1px solid #e7e7e2;font-size:13px}
th:last-child,td:last-child{border-right:0}
.month td{background:#e8e8e3;font-weight:900;font-size:18px;padding:8px 12px;border-top:3px solid #9ea3a7}.week td{background:#eceff1;font-weight:900;font-size:16px;padding:7px 12px;border-top:2px solid #8f989e;border-bottom:1px solid #aeb6bb;color:#30363a}
.event-row:nth-of-type(even) td{background:#fdfdfc}
.date,.date-head{text-align:center}.date{font-weight:800;white-space:nowrap;vertical-align:middle;font-size:13px;letter-spacing:0;padding-left:8px;padding-right:8px}
.event-meta-line{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;min-height:20px}.event-badges{display:flex;gap:5px;flex-wrap:wrap}.kind-badge,.tag{display:inline-block;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:800}.kind-badge{color:#fff}.kind-badge.exhibition{background:#166534}.kind-badge.gathering{background:#9a3412}.person-top{text-align:right;font-size:12px;font-weight:800;color:#555;white-space:nowrap;margin-left:auto}.event-head{display:block}.name{font-weight:800;font-size:14px}.name a{color:#184f9c;text-decoration:none}.name a:hover{text-decoration:underline}
.venue{margin-top:2px;color:var(--muted)}
.person{font-weight:800;margin-bottom:3px}.condline{margin:1px 0}.report-cond{margin:0 0 7px;padding:5px 7px;background:#f6f6f3;border-left:3px solid #c5c5bf;color:#555}.report-cond div{margin:1px 0}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.tag{border:1px solid #c8c8c2;background:#fff}
.attended{border-color:#8eb8ac;color:#246355;background:#f1f8f5}
.planned{border-color:#b8cbe2;color:#315d87;background:#f7fbff}
.notattended{border-color:#c9c9c5;color:#73736e;background:#f6f6f4}
.row-planned td:first-child{box-shadow:inset 4px 0 0 #b9d2ea}.attended-date{background:#f2f6f3!important;font-size:18px}.visit-count{margin-top:4px;font-size:12px;font-weight:900;color:#4f6b60}.attended-day-row td{border-top-color:#d8ddda}.attended-day-start td{border-top:2px solid #bfc7c2!important}.report-days{font-size:12px;font-weight:800;color:#5f6a64;margin:0 0 5px}.report-reference{font-size:12px;color:#7a7a74;padding:4px 0}
.row-notattended td{color:#777772;background:#f4f4f2!important}
.rating{font-weight:900;margin-bottom:3px}.report{white-space:pre-wrap}.pre{color:#555;margin-bottom:5px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:700px){.wrap{padding:8px}h1{font-size:17px}td,th{padding:6px 8px}.status{width:100%;margin-left:0}.calendars{grid-template-columns:repeat(3,minmax(220px,1fr));overflow-x:auto}.calendar-slider{overflow:hidden}}
</style>
</head>
<body>
<div class="wrap">
  <h1>無料食事イベント台帳　見やすさ確認版</h1>
  <div class="sub">本番画面とは別です。1イベントを1行にまとめ、見ることだけに絞っています。</div>
  <div class="controls">
    <button data-mode="all" class="active">すべて</button>
    <button data-mode="planned">来場予定</button>
    <button data-mode="attended">参加済み</button>
    <span id="status" class="status">読み込み中</span>
  </div>
  <section class="calendar-panel" aria-label="カレンダー">
    <div class="calendar-head"><div class="calendar-title">カレンダー</div><div id="calendarNote" class="calendar-note"></div></div>
    <div class="calendar-jump"><select id="calendarYear" class="calendar-year" aria-label="年"></select><div id="monthJump" class="month-jump"></div></div>
    <div class="calendar-slider"><button id="calendarPrev" class="calendar-arrow" type="button" aria-label="前の月">‹</button><div id="calendarMonths" class="calendars"></div><button id="calendarNext" class="calendar-arrow" type="button" aria-label="次の月">›</button></div>
  </section>
  <div class="table-wrap">
    <table>
      <colgroup><col class="date"><col class="event"><col class="detail"></colgroup>
      <thead><tr><th class="date-head">日付</th><th>イベント / 会場</th><th>条件 / 評価 / 内容・実地レポート</th></tr></thead>
      <tbody id="body"><tr><td colspan="3" class="empty">読み込み中です</td></tr></tbody>
    </table>
  </div>
  <div class="note">※ この確認版では編集・終了処理はできません。本番データは変更しません。</div>
</div>
<script>
const FLAGS_KEY='free_food_event_ledger_2026_flags_v2';
let events=[],reports=[],flags={},mode='all';
const calendarToday=new Date();
let calendarBaseYear=calendarToday.getFullYear(),calendarBaseMonth=calendarToday.getMonth()+1;

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').toLowerCase().replace(/[\s　・･｜|™®【】\[\]（）()‐\-–—'’:"：～〜]/g,'')}
function days(a,b){const out=[],x=new Date(a+'T00:00:00'),y=new Date((b||a)+'T00:00:00');for(let d=new Date(x);d<=y;d.setDate(d.getDate()+1))out.push(d.toISOString().slice(0,10));return out}
function inRange(e,d){return d>=e.date&&d<=(e.endDate||e.date)}
function flag(e){return flags[e.id]||{}}
function actualDates(e){return Array.isArray(e.visitDates)?e.visitDates:[]}
function plannedDates(e){
  const f=flag(e); let x=[];
  if(Array.isArray(f.visitDates))x=[...new Set(f.visitDates)].filter(d=>inRange(e,d));
  else if(f.planned)x=[e.date];
  const done=new Set(actualDates(e));
  return x.filter(d=>!done.has(d)).sort();
}
function dateText(e){
  if(e.dateText)return e.dateText.replace(/\t/g,' ').trim();
  return e.endDate&&e.endDate!==e.date ? e.date+'～'+e.endDate : e.date;
}
function personLines(e){return (e.conditionLines||[]).filter(x=>String(x).startsWith('名前コード：')).map(x=>String(x).replace(/^名前コード：/,'').trim())}
function conditionLines(e){return (e.conditionLines||[]).filter(x=>!String(x).startsWith('名前コード：'))}
function reportFor(e){
  if(e.sourceReportId){const x=reports.find(r=>r.id===e.sourceReportId);if(x)return x}
  const nn=norm(e.name);
  return reports.find(r=>norm(r.name)===nn && (r.scheduledDate===e.date || inRange(e,r.date))) || null;
}
function fmtDates(xs){return xs.map(x=>{const d=new Date(x+'T00:00:00');return (d.getMonth()+1)+'/'+d.getDate()}).join('・')}
function weekKey(iso){const d=new Date(iso+'T00:00:00'),n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}
function weekLabel(iso){const d=new Date(iso+'T00:00:00'),n=(d.getDay()+6)%7;const m=new Date(d);m.setDate(d.getDate()-n);const su=new Date(m);su.setDate(m.getDate()+6);return (m.getMonth()+1)+'/'+m.getDate()+'～'+(su.getMonth()+1)+'/'+su.getDate()}


function row(e){
  const r=reportFor(e), p=plannedDates(e), a=actualDates(e), people=personLines(e), cond=conditionLines(e);
  const badges=[];
  badges.push('<span class="kind-badge '+esc(e._kind)+'">'+(e._kind==='exhibition'?'展示会':'懇親会')+'</span>');
  if(a.length)badges.push('<span class="tag attended">参加 '+esc(fmtDates(a))+'</span>');
  if(p.length)badges.push('<span class="tag planned">予定 '+esc(fmtDates(p))+'</span>');
  if(e.attendanceStatus==='not_attended')badges.push('<span class="tag notattended">未参加</span>');
  const cls=e.attendanceStatus==='not_attended'?'row-notattended':(p.length?'row-planned':'');
  const link=e.url?'<a href="'+esc(e.url)+'" target="_blank" rel="noopener">'+esc(e.name)+'</a>':esc(e.name);
  const personTop=people.length?'<div class="person-top">'+esc(people.join(' / '))+'</div>':'';
  const eventCell='<div class="event-meta-line"><div class="event-badges">'+badges.join('')+'</div>'+personTop+'</div><div class="event-head"><div class="name">'+link+'</div></div><div class="venue">'+esc(e.venue||'')+'</div>';
  let detail='';
  if(cond.length)detail+='<div class="report-cond">'+cond.map(x=>'<div>'+esc(x)+'</div>').join('')+'</div>';
  if(!r && e.rating)detail+='<div class="pre">'+esc(e.rating)+'</div>';
  if(e.nightTime||e.nightText)detail+='<div>'+esc([e.nightTime,e.nightText].filter(Boolean).join('　'))+'</div>';
  if(r){
    detail+='<div class="rating">実地評価：'+esc(r.rating||'')+'</div>';
    detail+='<div class="report">'+esc(r.report||'')+'</div>';
  }
  return '<tr class="event-row '+cls+'" data-start-date="'+esc(e.date)+'" data-end-date="'+esc(e.endDate||e.date)+'"><td class="date">'+esc(dateText(e))+'</td><td>'+eventCell+'</td><td>'+detail+'</td></tr>';
}


function attendedRow(e,visitDate,showDate,rowspan,isFirstOfDate){
  const r=reportFor(e), people=personLines(e), cond=conditionLines(e);
  const visits=actualDates(e).slice().sort();
  const firstVisit=visits[0]||visitDate;
  const showReport=visitDate===firstVisit;

  const badges=['<span class="kind-badge '+esc(e._kind)+'">'+(e._kind==='exhibition'?'展示会':'懇親会')+'</span>'];
  const link=e.url?'<a href="'+esc(e.url)+'" target="_blank" rel="noopener">'+esc(e.name)+'</a>':esc(e.name);
  const personTop=people.length?'<div class="person-top">'+esc(people.join(' / '))+'</div>':'';

  let schedule='';
  if(e.endDate&&e.endDate!==e.date) schedule='<div class="venue">開催 '+esc(dateText(e))+'</div>';
  else if(e.date!==visitDate) schedule='<div class="venue">開催 '+esc(dateText(e))+'</div>';

  const eventCell='<div class="event-meta-line"><div class="event-badges">'+badges.join('')+'</div>'+personTop+'</div><div class="event-head"><div class="name">'+link+'</div></div><div class="venue">'+esc(e.venue||'')+'</div>'+schedule;

  let detail='';
  if(showReport){
    if(cond.length)detail+='<div class="report-cond">'+cond.map(x=>'<div>'+esc(x)+'</div>').join('')+'</div>';
    if(r){
      detail+='<div class="rating">実地評価：'+esc(r.rating||'')+'</div>';
      if(visits.length>1)detail+='<div class="report-days">参加日 '+esc(fmtDates(visits))+'</div>';
      detail+='<div class="report">'+esc(r.report||'')+'</div>';
    }
  }else{
    detail+='<div class="report-reference">レポートは '+esc(fmtDates([firstVisit]))+' に表示</div>';
  }

  const dateCell=showDate?'<td class="date attended-date" rowspan="'+rowspan+'"><strong>'+esc(visitDate.replace(/^\\d{4}-/,'').replace('-','/'))+'</strong><div class="visit-count">'+rowspan+'件</div></td>':'';
  return '<tr class="event-row attended-day-row'+(isFirstOfDate?' attended-day-start':'')+'" data-visit-date="'+esc(visitDate)+'" data-start-date="'+esc(e.date)+'" data-end-date="'+esc(e.endDate||e.date)+'">'+dateCell+'<td>'+eventCell+'</td><td>'+detail+'</td></tr>';
}

function isoDate(y,m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function calendarDatesForEvent(e){
  if(mode==='attended')return actualDates(e);
  if(mode==='planned')return plannedDates(e);
  return days(e.date,e.endDate||e.date);
}
function calendarMap(){
  const map=new Map();
  for(const e of events){
    for(const d of calendarDatesForEvent(e)){
      if(!map.has(d))map.set(d,0);
      map.set(d,map.get(d)+1);
    }
  }
  return map;
}
function availableYears(){
  const ys=new Set([calendarToday.getFullYear()]);
  for(const e of events){
    if(e.date)ys.add(Number(e.date.slice(0,4)));
    if(e.endDate)ys.add(Number(e.endDate.slice(0,4)));
    for(const d of actualDates(e))ys.add(Number(d.slice(0,4)));
    for(const d of plannedDates(e))ys.add(Number(d.slice(0,4)));
  }
  return [...ys].filter(Number.isFinite).sort((a,b)=>a-b);
}
function buildMonthCard(year,month,map){
  const card=document.createElement('div');card.className='month-card';
  const title=document.createElement('div');title.className='month-name';title.textContent=year+'年'+month+'月';card.appendChild(title);
  const grid=document.createElement('div');grid.className='month-grid';
  ['日','月','火','水','木','金','土'].forEach(w=>{const x=document.createElement('div');x.className='weekday';x.textContent=w;grid.appendChild(x)});
  const first=new Date(year,month-1,1),last=new Date(year,month,0).getDate();
  for(let i=0;i<first.getDay();i++){const x=document.createElement('div');x.className='cal-day empty';grid.appendChild(x)}
  for(let d=1;d<=last;d++){
    const key=isoDate(year,month,d),x=document.createElement('div');x.className='cal-day';x.textContent=d;
    if(map.has(key)){
      x.classList.add(mode==='attended'?'has-attended':mode==='planned'?'has-plan':'has-event','clickable');
      x.title=(mode==='attended'?'参加済み ':mode==='planned'?'来場予定 ':'イベント ')+map.get(key)+'件';
      x.onclick=()=>jumpToDate(key);
    }
    if(year===calendarToday.getFullYear()&&month===calendarToday.getMonth()+1&&d===calendarToday.getDate())x.classList.add('today');
    grid.appendChild(x);
  }
  card.appendChild(grid);return card;
}
function renderCalendar(){
  const months=document.getElementById('calendarMonths'),yearSel=document.getElementById('calendarYear'),jump=document.getElementById('monthJump'),note=document.getElementById('calendarNote');
  const map=calendarMap();months.innerHTML='';
  const ys=availableYears();
  yearSel.innerHTML=ys.map(y=>'<option value="'+y+'" '+(y===calendarBaseYear?'selected':'')+'>'+y+'</option>').join('');
  jump.innerHTML=Array.from({length:12},(_,i)=>'<button type="button" data-month="'+(i+1)+'" class="'+(i+1===calendarBaseMonth?'active':'')+'">'+(i+1)+'月</button>').join('');
  note.textContent=mode==='attended'?'緑＝実際に参加した日':mode==='planned'?'青＝来場予定日':'灰＝イベント開催日';
  for(let off=0;off<3;off++){
    const d=new Date(calendarBaseYear,calendarBaseMonth-1+off,1);
    months.appendChild(buildMonthCard(d.getFullYear(),d.getMonth()+1,map));
  }
}
function setCalendarBase(year,month){
  const d=new Date(year,month-1,1);calendarBaseYear=d.getFullYear();calendarBaseMonth=d.getMonth()+1;renderCalendar();
}
function jumpToDate(date){
  let rows=[...document.querySelectorAll('tr.event-row')],target=null;
  if(mode==='attended')target=rows.find(r=>r.dataset.visitDate===date);
  else target=rows.find(r=>{
    const a=r.dataset.startDate,b=r.dataset.endDate||a;
    return a&&date>=a&&date<=b;
  });
  if(!target)return;
  target.scrollIntoView({behavior:'smooth',block:'center'});
  target.classList.remove('calendar-focus');void target.offsetWidth;target.classList.add('calendar-focus');
  setTimeout(()=>target.classList.remove('calendar-focus'),1400);
}

function venueSortKey(e){
  const v=String(e.venue||'').replace(/\s+/g,' ').trim();
  const isBigSight=/ビッ?クサイト|東京ビッグサイト/.test(v);
  if(isBigSight){
    const areas=[['東',0],['西',1],['南',2]];
    for(const [label,rank] of areas){
      const m=v.match(new RegExp(label+'\\s*(\\d+)'));
      if(m)return [0,rank,Number(m[1]),v];
    }
    return [0,9,999,v];
  }
  return [1,0,0,v];
}
function compareVenue(a,b){
  const x=venueSortKey(a),y=venueSortKey(b);
  for(let i=0;i<3;i++){if(x[i]!==y[i])return x[i]-y[i];}
  const vd=String(x[3]).localeCompare(String(y[3]),'ja',{numeric:true});
  if(vd)return vd;
  return String(a.name||'').localeCompare(String(b.name||''),'ja',{numeric:true});
}

function render(){
  if(mode==='attended'){
    const items=[];
    for(const e of events){
      if(e.attendanceStatus!=='attended')continue;
      for(const d of actualDates(e))items.push({e,d});
    }
    items.sort((a,b)=>a.d.localeCompare(b.d)||compareVenue(a.e,b.e));
    let html='',month='',week='',i=0;
    while(i<items.length){
      const d=items[i].d,m=d.slice(0,7),w=weekKey(d);
      if(m!==month){
        const [y,mm]=m.split('-');
        html+='<tr class="month"><td colspan="3">'+esc(y)+'年'+Number(mm)+'月</td></tr>';
        month=m;week='';
      }
      if(w!==week){
        html+='<tr class="week"><td colspan="3">'+esc(weekLabel(d))+'</td></tr>';
        week=w;
      }
      const same=[];
      while(i<items.length&&items[i].d===d){same.push(items[i]);i++;}
      same.forEach((x,idx)=>{html+=attendedRow(x.e,d,idx===0,same.length,idx===0);});
    }
    document.getElementById('body').innerHTML=html||'<tr><td colspan="3" class="empty">参加済みイベントはありません</td></tr>';
    document.getElementById('status').textContent=items.length+'件';
    renderCalendar();
    return;
  }

  let list=events.slice();
  if(mode==='planned')list=list.filter(e=>plannedDates(e).length);
  list.sort((a,b)=>a.date.localeCompare(b.date)||compareVenue(a,b));
  let html='',month='',week='';
  for(const e of list){
    const m=e.date.slice(0,7),w=weekKey(e.date);
    if(m!==month){
      const [y,mm]=m.split('-');
      html+='<tr class="month"><td colspan="3">'+esc(y)+'年'+Number(mm)+'月</td></tr>';
      month=m;week='';
    }
    if(w!==week){
      html+='<tr class="week"><td colspan="3">'+esc(weekLabel(e.date))+'</td></tr>';
      week=w;
    }
    html+=row(e);
  }
  document.getElementById('body').innerHTML=html||'<tr><td colspan="3" class="empty">該当するイベントはありません</td></tr>';
  document.getElementById('status').textContent=list.length+'件';
  renderCalendar();
}

document.querySelector('.controls').addEventListener('click',e=>{
  const b=e.target.closest('button[data-mode]');if(!b)return;
  mode=b.dataset.mode;
  document.querySelectorAll('button[data-mode]').forEach(x=>x.classList.toggle('active',x===b));
  render();
});

document.getElementById('calendarPrev').onclick=()=>setCalendarBase(calendarBaseYear,calendarBaseMonth-1);
document.getElementById('calendarNext').onclick=()=>setCalendarBase(calendarBaseYear,calendarBaseMonth+1);
document.getElementById('calendarYear').addEventListener('change',e=>setCalendarBase(Number(e.target.value),calendarBaseMonth));
document.getElementById('monthJump').addEventListener('click',e=>{const b=e.target.closest('button[data-month]');if(b)setCalendarBase(calendarBaseYear,Number(b.dataset.month));});
