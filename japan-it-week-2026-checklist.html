<body><header><div><h1>Japan IT Week 秋2026 現地チェック</h1>

const KEY='japan-it-week-2026-autumn-checklist-v1';
let done={};try{done=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){}
let mode='gifts';const q=document.querySelector('#search'),hall=document.querySelector('#hall'),pending=document.querySelector('#pending'),cards=document.querySelector('#cards');
const halls=[...new Set(DATA.map(d=>{const m=d.b.match(/^A(\d+)-/);return m?String(Math.ceil(parseInt(m[1],10)/10)):'特設';}))].sort((a,b)=>a==='特設'?1:b==='特設'?-1:Number(a)-Number(b));
for(const h of halls){let o=document.createElement('option');o.value=h;o.textContent=h==='特設'?'特設小間（S）':('小間A'+((Number(h)-1)*10+1)+'〜A'+(Number(h)*10));hall.append(o)}
function tx(s){return document.createTextNode(s)}
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(_){}}
function group(d){const m=d.b.match(/^A(\d+)-/);return m?String(Math.ceil(parseInt(m[1],10)/10)):'特設'}
function make(d){const c=el('article','card'+(done[d.b]?' done':'')),head=el('div','head'),label=el('label','clickcheck'),inp=el('input');inp.type='checkbox';inp.checked=!!done[d.b];inp.setAttribute('aria-label',d.n+'をチェック');inp.onchange=()=>{done[d.b]=inp.checked;save();render()};label.append(inp,el('span','circle','✓'));head.append(label,el('div','loc',d.b.startsWith('A')?'小間　'+d.b:'特設　'+d.b));c.append(head,el('div','name',d.n),el('div','gift',d.g));const line=el('div','need');if(d.q)line.append(el('span',d.q==='対象者限定'?'restricted':'qty',d.q+'　'));line.append(tx(d.c));const btn=el('button','more','詳細');btn.type='button';line.append(tx('　'),btn);c.append(line);let detail=el('div','details');detail.hidden=true;detail.append(el('div','',d.full));if(d.note)detail.append(el('div','',d.note));const src=el('a','','企業・主催者の告知を見る');src.href=d.src||'#';src.target='_blank';src.rel='noopener noreferrer';if(d.src)detail.append(src);c.append(detail);btn.onclick=()=>{detail.hidden=!detail.hidden;btn.textContent=detail.hidden?'詳細':'閉じる'};return c}
function render(){const search=q.value.trim().toLowerCase(),h=hall.value;const view=DATA.filter(d=>(mode==='all'||!d.service)&&(!h||group(d)===h)&&(!pending.checked||!done[d.b])&&(!search||[d.b,d.n,d.g,d.c,d.full].join(' ').toLowerCase().includes(search)));cards.replaceChildren();document.querySelector('#count').textContent=view.length+'件表示／確認済み '+DATA.filter(d=>done[d.b]).length+'件';if(!view.length)cards.append(el('div','empty','該当する項目はありません'));else for(const d of view)cards.append(make(d))}
q.oninput=render;hall.onchange=render;pending.onchange=render;for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{mode=b.dataset.mode;for(const x of document.querySelectorAll('[data-mode]'))x.classList.toggle('current',x===b);render()};
document.querySelector('#print').onclick=()=>window.print();document.querySelector('#copy').onclick=async()=>{const t='Japan IT Week 2026 確認済み\n'+(DATA.filter(d=>done[d.b]).map(d=>d.b+' '+d.n).join('\n')||'未チェック');try{await navigator.clipboard.writeText(t);alert('コピーしました')}catch(_){prompt('ここからコピーしてください',t)}};render();
</script></body></html>
