name: Verify BRT timetable preview
on:
  push:
    paths:
      - .github/workflows/brt-preview-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test published page and all four routes
        run: |
          cat > /tmp/brt-check.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const size of [{width:390,height:844},{width:1280,height:900}]){
              const page=await browser.newPage({viewport:size,locale:'ja-JP'});
              await page.goto('https://rensei11.github.io/01-event/%E7%A2%BA%E8%AA%8D%E7%94%A8.html',{waitUntil:'domcontentloaded',timeout:60000});
              await page.locator('#timetableOpen').click();
              const box1=await page.locator('.timetable-dialog').boundingBox();
              assert(box1 && box1.height>300,'initial window too small');
              if(size.width===390){
                const header=await page.locator('.title-status-row h1').boundingBox();
                const version=await page.locator('.version-info').boundingBox();
                const trigger=await page.locator('#timetableOpen').boundingBox();
                assert(header.height<36,'title wrapped into vertical lines');
                assert(version.y>header.y && trigger.y>version.y,'mobile control placement incorrect');
              }
              await page.getByRole('button',{name:'東京BRT'}).click();
              const routes=[
                ['国際展示場発','brt-bigsight-marked.png'],
                ['新橋発（虎ノ門ヒルズ方面）','brt-shimbashi-toranomon-map.png'],
                ['虎ノ門ヒルズ発','brt-toranomon.png'],
                ['新橋発（国際展示場方面）','brt-shimbashi-bigsight.png']
              ];
              const labels=await page.locator('#timetableStops button').allTextContents();
              assert.deepEqual(labels, routes.map(r=>r[0]), 'Incorrect stop button order');
              for(const [stop,filename] of routes){
                await page.locator('#timetableStops').getByRole('button',{name:stop,exact:true}).click();
                const img=page.locator('#timetableDisplay img');
                await img.waitFor({state:'visible'});
                await img.evaluate(image=>image.decode());
                const d=await img.evaluate(image=>({w:image.naturalWidth,h:image.naturalHeight,src:image.currentSrc,maxHeight:getComputedStyle(image).maxHeight}));
                assert(d.src.includes(filename),'Wrong image for '+stop);
                assert(d.w>=900 && d.h>=2000,'Expected original tables stacked vertically '+stop+' '+JSON.stringify(d));
                assert(d.maxHeight==='none','Image still constrained by max-height');
                if(stop==='国際展示場発')assert((await page.locator('.timetable-note').innerText()).includes('赤丸'), 'Missing red-circle explanation');
                if(stop==='新橋発（虎ノ門ヒルズ方面）')assert(d.h>2600,'Station map missing under holiday timetable');
                const closeStyle=await page.locator('.timetable-close').evaluate(el=>({display:getComputedStyle(el).display,placeItems:getComputedStyle(el).placeItems,flexBasis:getComputedStyle(el).flexBasis,rect:el.getBoundingClientRect().toJSON()}));
                assert(closeStyle.display==='grid'&&closeStyle.placeItems.includes('center'), 'Close button not centered');
                const cross=await page.locator('.timetable-close').evaluate(el=>({
                  before:getComputedStyle(el,'::before').transform,
                  after:getComputedStyle(el,'::after').transform,
                  aria:el.getAttribute('aria-label')
                }));
                assert(cross.before!=='none'&&cross.after!=='none'&&cross.before!==cross.after,'Close cross not drawn centered');
                assert(cross.aria==='時刻表を閉じる','Close button lost accessible name');
                const heading=await page.locator('.timetable-display-title').innerText();
                if(stop==='国際展示場発')assert(heading.includes('（新橋まで約15分）'),'Missing official 15min');
                if(stop==='新橋発（国際展示場方面）')assert(heading.includes('（国際展示場まで約15～17分）'),'Missing official 15-17min');
                const box=await page.locator('.timetable-dialog').boundingBox();
                assert(Math.abs(box.height-box1.height)<2,'Dialog size changed after selection '+stop);
                console.log('PASS',size.width,stop,d.w,d.h);
              }
              const imageBefore=page.locator('#timetableDisplay img');
              await imageBefore.evaluate(img=>{img.dataset.reused='verified';});
              await page.locator('.timetable-close').click();
              assert(await page.locator('#timetableModal').isHidden());
              await page.locator('#timetableOpen').click();
              assert.equal(await page.locator('#timetableDisplay img').getAttribute('data-reused'),'verified','Reopening recreated image');
              assert((await page.locator('.timetable-display-title').innerText()).includes('新橋発（国際展示場方面）'),'Reopening lost current selection');
              const saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('event_timetable_last_stop_v1')));
              assert.equal(saved.stop,'shimbashi-kokusai','Saved selection incorrect');
              await page.locator('.timetable-close').click();
              await page.reload({waitUntil:'domcontentloaded'});
              await page.locator('#timetableOpen').click();
              assert((await page.locator('.timetable-display-title').innerText()).includes('新橋発（国際展示場方面）'),'Reload lost selected timetable');
              await page.locator('#timetableDisplay img').evaluate(img=>img.decode());
              console.log('PASS',size.width,'same-page reopen and after-reload last route restored');
              await page.locator('.timetable-close').click();
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/brt-check.cjs
