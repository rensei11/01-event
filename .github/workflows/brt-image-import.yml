name: Build BRT timetable images once
on:
  push:
    paths:
      - .github/workflows/brt-image-import.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render four current official route timetables
        run: |
          mkdir -p assets/timetables
          cat > /tmp/brt-capture.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const jobs=[
              ['toranomon','https://tokyo-brt.co.jp/bus-stops/b11-toranomon-hills','虎ノ門ヒルズ発', 'first'],
              ['bigsight','https://tokyo-brt.co.jp/bus-stops/b05-kokusaitenjijo','国際展示場発','first'],
              ['shimbashi-bigsight','https://tokyo-brt.co.jp/bus-stops/b01-shimbashi','新橋発 → 国際展示場','first'],
              ['shimbashi-toranomon','https://tokyo-brt.co.jp/bus-stops/b01-shimbashi','新橋発 → 虎ノ門ヒルズ','last']
            ];
            for(const [slug,url,title,part] of jobs){
              const page=await browser.newPage({viewport:{width:1320,height:1800},deviceScaleFactor:1.5,locale:'ja-JP'});
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(1000);

              const tabId=slug==='shimbashi-bigsight'?'tabItem4':'tabItem1';
              await page.evaluate(id=>{
                const tabs=[...document.querySelectorAll('#stop-time-table .tabItem')];
                if(!tabs.some(t=>t.id===id))throw Error('Tab missing: '+id);
                for(const el of tabs)el.style.display=el.id===id?'block':'none';
              },tabId);
              const tab=page.locator('#'+tabId);
              const check=await tab.evaluate(el=>({
                count:el.querySelectorAll('table.table-tt').length,
                text:el.innerText.slice(-220),
                width:el.getBoundingClientRect().width,
                height:el.getBoundingClientRect().height
              }));
              console.log('ORIGINAL',slug,JSON.stringify(check));
              if(check.count!==2||check.width<1000||check.height<500)throw Error('Incomplete official table: '+slug);
              await tab.screenshot({path:'assets/timetables/brt-'+slug+'.png',animations:'disabled'});
              console.log('IMAGE',slug,fs.statSync('assets/timetables/brt-'+slug+'.png').size);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/brt-capture.cjs
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/timetables/brt-*.png
          if git diff --cached --quiet; then
            echo 'No image changes'
          else
            git commit -m "Restore BRT official timetable images"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
