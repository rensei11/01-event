name: Build BRT timetable images once
on:
  push:
    paths:
      - .github/workflows/brt-image-import.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
      - name: Render four current official route timetables
        run: |
          mkdir -p assets/timetables
          cat > /tmp/brt-capture.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          const sharp=require(process.cwd()+'/node_modules/sharp');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const jobs=[
              ['toranomon','https://tokyo-brt.co.jp/bus-stops/b11-toranomon-hills','虎ノ門ヒルズ発', 'first'],
              ['bigsight','https://tokyo-brt.co.jp/bus-stops/b05-kokusaitenjijo','国際展示場発','first'],
              ['shimbashi-bigsight','https://tokyo-brt.co.jp/bus-stops/b01-shimbashi','新橋発 → 国際展示場','first'],
              ['shimbashi-toranomon','https://tokyo-brt.co.jp/bus-stops/b01-shimbashi','新橋発 → 虎ノ門ヒルズ','last']
            ];
            for(const [slug,url,title,part] of jobs){
              const page=await browser.newPage({viewport:{width:1320,height:1800},deviceScaleFactor:1.5,locale:'ja-JP'});
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(1000);

              const tabId=slug==='shimbashi-bigsight'?'tabItem4':'tabItem1';
              await page.evaluate(id=>{
                const tabs=[...document.querySelectorAll('#stop-time-table .tabItem')];
                if(!tabs.some(t=>t.id===id))throw Error('Tab missing: '+id);
                for(const el of tabs)el.style.display=el.id===id?'block':'none';
              },tabId);

              const tab=page.locator('#'+tabId);
              const weekday=tab.locator('table.table-tt.weekday');
              const holiday=tab.locator('table.table-tt.holiday');
              const [tb,wb,hb]=await Promise.all([tab.boundingBox(),weekday.boundingBox(),holiday.boundingBox()]);
              if(!tb||!wb||!hb||wb.width<400||hb.width<400)throw Error('Original table not visible '+slug);
              const [w,h,full]=await Promise.all([weekday.screenshot(),holiday.screenshot(),tab.screenshot()]);
              const [wm,hm,fm]=await Promise.all([sharp(w).metadata(),sharp(h).metadata(),sharp(full).metadata()]);
              const ratio=fm.width/tb.width;
              const top=Math.min(fm.height-1,Math.round((Math.max(wb.y+wb.height,hb.y+hb.height)-tb.y)*ratio));
              const foot=await sharp(full).extract({left:0,top,width:Math.min(fm.width,wm.width),height:fm.height-top}).png().toBuffer();
              const fh=(await sharp(foot).metadata()).height, gap=18;
              const width=Math.max(wm.width,hm.width),height=wm.height+hm.height+fh+gap*2;
              const file='assets/timetables/brt-'+slug+'.png';
              await sharp({create:{width,height,channels:4,background:'#ffffff'}})
                .composite([{input:w,left:0,top:0},{input:h,left:0,top:wm.height+gap},{input:foot,left:0,top:wm.height+gap+hm.height+gap}])
                .png().toFile(file);
              console.log('STACKED',slug,JSON.stringify({width,height,bytes:fs.statSync(file).size}));
              if(fs.statSync(file).size<12000||fh<30)throw Error('Incomplete timetable '+slug);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/brt-capture.cjs
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/timetables/brt-*.png
          if git diff --cached --quiet; then
            echo 'No image changes'
          else
            git commit -m "Restore BRT official timetable images"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
