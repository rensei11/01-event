name: Audit external JFEX image HTML
on:
  push:
    branches:
      - audit-jfex-image-20261110
    paths:
      - .github/workflows/audit-jfex-image-20261110.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public website source and image responses
        shell: bash
        run: |
          python3 - <<'PY'
          import html as htmlmod, re, urllib.parse, urllib.request, urllib.error
          url='https://zenkaren.net/archives/32277'
          ua={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36'}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=ua),timeout=25) as resp:
                  raw=resp.read()
                  markup=raw.decode('utf-8',errors='replace')
                  print('PAGE', resp.status, 'URL',resp.url,'BYTES',len(raw),'CONTENT_TYPE',resp.headers.get('Content-Type'))
          except Exception as e:
              print('PAGE_FETCH_FAILED',repr(e)); raise
          for q in ('VIP 登録用URL','1,000円分','ランチ券','本画面','一般　登録用URL'):
              p=markup.find(q)
              print('NEAR_TEXT',repr(q),'position',p)
              if p>=0:print('NEAR_HTML',re.sub(r'\s+',' ',markup[max(0,p-600):p+200])[:1400])
          tags=list(re.finditer(r'<img\b[^>]*>',markup,re.I|re.S))
          print('IMG_COUNT',len(tags))
          for n,m in enumerate(tags):
              attrs=dict((k.lower(),htmlmod.unescape(v)) for k,v in re.findall(r'([\w:-]+)\s*=\s*["\x27]([^"\x27]*)["\x27]',m.group(0)))
              pos=m.start()
              context=re.sub(r'<[^>]+>',' ',markup[max(0,pos-100):pos+40])
              context=re.sub(r'\s+',' ',htmlmod.unescape(context))[:100]
              if n>=35 and not (markup.find('1,000円分')-3000<=pos<=markup.find('1,000円分')+2000):
                  continue
              print('IMAGE',n,'AT',pos,'ATTR',str(attrs)[:900],'CONTEXT',context)
              if not (markup.find('1,000円分')-5000<=pos<=markup.find('1,000円分')+2000):continue
              for key in ('src','data-src','data-lazy-src'):
                  val=attrs.get(key,'')
                  if not val:continue
                  absolute=urllib.parse.urljoin(url,val)
                  print('TRY_IMAGE',key,absolute)
                  if not absolute.startswith('http'):continue
                  try:
                      with urllib.request.urlopen(urllib.request.Request(absolute,headers=ua),timeout=20) as rr:
                          first=rr.read(40)
                          print('IMAGE_RESPONSE',rr.status,rr.url,rr.headers.get('Content-Type'),rr.headers.get('Content-Length'),repr(first))
                  except Exception as e:print('IMAGE_FETCH_ERROR',repr(e))
          print('HTML_AUDIT_COMPLETE')
          PY
