name: Verify event save gateway health
on:
  push:
    paths:
      - .github/workflows/event-save-healthcheck.yml
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check worker version and browser preflight
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          import json
          base='https://dawn-morning-780a.aoigiftmiki.workers.dev'
          def check(name,request):
              try:
                  with urllib.request.urlopen(request,timeout=20) as r:
                      body=r.read(1200).decode('utf-8','replace')
                      print(name,'HTTP',r.status,'cors',r.headers.get('Access-Control-Allow-Origin',''),'BODY',body[:300])
              except urllib.error.HTTPError as e:
                  body=e.read(1200).decode('utf-8','replace')
                  print(name,'HTTP',e.code,'cors',e.headers.get('Access-Control-Allow-Origin',''),'BODY',body[:300])
              except Exception as e:
                  print(name,'ERROR',type(e).__name__,str(e)[:400])
          check('VERSION',urllib.request.Request(base+'/version',headers={'Origin':'https://rensei11.github.io','User-Agent':'EventLedgerHealthCheck/1.0'}))
          check('OPTIONS',urllib.request.Request(base+'/save-v2',method='OPTIONS',headers={'Origin':'https://rensei11.github.io','Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'Content-Type,X-Edit-Key','User-Agent':'EventLedgerHealthCheck/1.0'}))
          check('INVALID-KEY',urllib.request.Request(base+'/save-v2',data=b'{"action":"bulk_end_process","entries":[]}',method='POST',headers={'Origin':'https://rensei11.github.io','Content-Type':'application/json','X-Edit-Key':'healthcheck-invalid-key','User-Agent':'EventLedgerHealthCheck/1.0'}))
          PY
