name: Prepare two annotated BRT timetables
on:
  push:
    paths:
      - .github/workflows/brt-special-images.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install processing tools
        run: |
          npm install --no-save sharp playwright
          npx playwright install --with-deps chromium
      - name: Prepare official graphics and annotations
        run: |
          cat > /tmp/brt-special.cjs <<'JS'
          const sharp=require(process.cwd()+'/node_modules/sharp');
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          const root='assets/timetables/';
          async function appendMap(){
            const src=root+'brt-shimbashi-toranomon.png';
            const meta=await sharp(src).metadata();
            const response=await fetch('https://tokyo-brt.co.jp/img/home/img-shinbashi-noriba.jpg');
            if(!response.ok)throw Error('Map download HTTP '+response.status);
            const data=Buffer.from(await response.arrayBuffer());
            const map=await sharp(data).resize({width:meta.width}).png().toBuffer();
            const m=await sharp(map).metadata();
            const spacer=25;
            const final=await sharp({create:{width:meta.width,height:meta.height+m.height+spacer,channels:4,background:'#ffffff'}})
              .composite([{input:await sharp(src).png().toBuffer(),left:0,top:0},{input:map,left:0,top:meta.height+spacer}])
              .png().toBuffer();
            const output=root+'brt-shimbashi-toranomon-map.png';
            fs.writeFileSync(output,final);
            console.log('MAP',JSON.stringify({width:meta.width,height:meta.height+m.height+spacer,bytes:final.length,sourceBytes:data.length}));
          }
          const minutes={
            12:['03','25','48'],13:['04','25','40'],
            14:['04','18','40','49'],15:['14','27','48'],
            16:['02','25','57'],17:['15','32']
          };
          async function addCircles(){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1320,height:1800},deviceScaleFactor:1.5,locale:'ja-JP'});
            await page.goto('https://tokyo-brt.co.jp/bus-stops/b05-kokusaitenjijo',{waitUntil:'domcontentloaded',timeout:60000});
            await page.evaluate(()=>{for(const el of document.querySelectorAll('#stop-time-table .tabItem'))el.style.display=el.id==='tabItem1'?'block':'none';});
            const selection=await page.locator('#tabItem1 table.table-tt.weekday').evaluate((table,target)=>{
              const main=table.getBoundingClientRect();
              const points=[];
              const debug=[];
              for(const tr of table.querySelectorAll('tr')){
                const cells=[...tr.children].filter(e=>e.matches('td,th'));
                if(cells.length<2)continue;
                const hour=Number(cells[0].textContent.trim());
                if(!target[hour])continue;
                const walker=document.createTreeWalker(cells[1],NodeFilter.SHOW_TEXT);
                const occurrences={};
                let node;
                while((node=walker.nextNode())){
                  const txt=node.textContent;
                  const pattern=/(?<!\d)\d{2}(?!\d)/g;
                  for(const match of txt.matchAll(pattern)){
                    const minute=match[0];
                    if(!target[hour].includes(minute))continue;
                    const range=document.createRange();
                    range.setStart(node,match.index);range.setEnd(node,match.index+2);
                    const r=range.getBoundingClientRect();
                    if(r.width<5||r.height<5)continue;
                    const id=hour+':'+minute;
                    occurrences[id]=(occurrences[id]||0)+1;
                    points.push({id,x:r.x-main.x+r.width/2,y:r.y-main.y+r.height/2,rx:r.width/2+5,ry:r.height/2+2,width:r.width,height:r.height});
                  }
                }
                debug.push({hour,text:cells[1].innerText.slice(0,170),found:points.filter(p=>p.id.startsWith(hour+':')).map(p=>p.id),occurrences});
              }
              return {width:main.width,height:main.height,points,debug};
            },minutes);
            console.log('POINTS',JSON.stringify(selection));
            const targetIds=Object.entries(minutes).flatMap(([hour,mins])=>mins.map(x=>hour+':'+x));
            if(targetIds.length!==18)throw Error('Expected 18 red rings');
            const found=selection.points.map(p=>p.id);
            for(const id of targetIds)if(found.filter(x=>x===id).length!==1)throw Error('Ambiguous/missing minute '+id+'; found: '+JSON.stringify(selection.debug));
            const source=root+'brt-bigsight.png';
            const meta=await sharp(source).metadata();
            const scale=meta.width/selection.width;
            if(Math.abs(scale-1.5)>0.03)throw Error('Unexpected timetable scale '+scale);
            const circles=selection.points.map(p=>'<ellipse cx="'+(p.x*scale).toFixed(1)+'" cy="'+(p.y*scale).toFixed(1)+'" rx="'+(Math.max(12,p.rx*scale)).toFixed(1)+'" ry="'+(Math.max(12,p.ry*scale)).toFixed(1)+'" fill="none" stroke="#e60012" stroke-width="2.7"/>').join('');
            const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+meta.width+'" height="'+meta.height+'">'+circles+'</svg>';
            const output=root+'brt-bigsight-marked.png';
            const final=await sharp(source).composite([{input:Buffer.from(svg),left:0,top:0}]).png().toBuffer();
            fs.writeFileSync(output,final);
            console.log('CIRCLES',JSON.stringify({count:selection.points.length,width:meta.width,height:meta.height,bytes:final.length}));
            await browser.close();
          }
          (async()=>{await appendMap();await addCircles();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/brt-special.cjs
      - name: Commit new graphics only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/brt-special
          cp assets/timetables/brt-bigsight-marked.png assets/timetables/brt-shimbashi-toranomon-map.png /tmp/brt-special/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/brt-special/*.png assets/timetables/
          git add assets/timetables/brt-bigsight-marked.png assets/timetables/brt-shimbashi-toranomon-map.png
          git commit -m "Add marked Kokusai-Tenjijo timetable and Shimbashi platform map"
          git push origin HEAD:main
