<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>無料食事イベント台帳 読み込み中</title>
<style>body{font-family:"Yu Gothic UI",Meiryo,sans-serif;padding:24px;color:#222}#msg{font-size:15px}</style>
</head>
<body>
<div id="msg">無料食事イベント台帳を読み込んでいます…</div>
<script>
(async()=>{
  try{
    const parts=[];
    for(let i=0;i<=5;i++){
      const r=await fetch(`site/chunk${i}.txt?v=${Date.now()}`,{cache:'no-store'});
      if(!r.ok) throw new Error(`chunk${i} の取得に失敗しました`);
      parts.push(await r.text());
    }
    const html=parts.join('');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('msg').textContent='台帳の読み込みに失敗しました。ページを再読み込みしてください。';
    console.error(e);
  }
})();
</script>
</body>
</html>
