<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>無料食事イベント 調査済み台帳 2026</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--line:#d6dce2;--head:#20262d;--text:#1d2329;--muted:#606a74;--week:#e8edf2;--link:#0b57d0;--planned:#e8f4ff;--ignored:#f7f8f9;--report-bad:#fff0f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Meiryo",sans-serif;line-height:1.55}
.wrap{max-width:1320px;margin:0 auto;padding:18px}
h1{font-size:22px;margin:0 0 4px}.meta{font-size:13px;color:var(--muted);margin:0 0 12px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.status{font-size:12px;font-weight:700}.save-ok{color:#18794e}.save-warn{color:#9a6700}.help,.note{font-size:12px;color:var(--muted)}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.view-tabs{display:flex;gap:6px;flex-wrap:wrap}.view-tab.active{background:#20262d;color:#fff;border-color:#20262d}.reset-btn{margin-left:auto}.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 14px}.subtab{min-width:110px;border:2px solid #9aa5b1;border-radius:9px;padding:9px 20px;background:#fff;font-size:15px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.06)}.subtab:hover{background:#eef3f8}.subtab.active{background:#2f6fda;border-color:#2f6fda;color:#fff;box-shadow:0 2px 5px rgba(0,0,0,.16)}.kind-badge,.attendance-badge{display:inline-block;margin:0 5px 4px 0;padding:2px 8px;border-radius:10px;color:#fff;font-size:11px;font-weight:800;line-height:1.35}.kind-badge.exhibition{background:#166534}.kind-badge.gathering{background:#9a3412}.attendance-badge.attended{background:#0f766e}.attendance-badge.not-attended{background:#6b7280}button{border:1px solid #aeb7c0;background:#fff;border-radius:7px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}button:hover{background:#f2f4f6}
.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;box-shadow:0 1px 4px rgba(0,0,0,.04)}
table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:840px}col.date{width:7%}col.event{width:29%}col.cond{width:19%}col.eval{width:45%}col.report-date{width:10%}col.report-event{width:35%}col.report-text{width:55%}thead th{position:sticky;top:0;z-index:2;background:var(--head);color:#fff;text-align:left;font-size:14px;padding:10px 12px;border-right:1px solid #3d4650}tbody td{vertical-align:top;padding:10px 12px;border-top:1px solid var(--line);border-right:1px solid var(--line);font-size:14px}tbody td:last-child,thead th:last-child{border-right:0}.date-head{text-align:center}.date-cell{text-align:center;vertical-align:middle;font-weight:700;white-space:nowrap}.week-row td{background:var(--week);font-weight:700;padding:7px 12px;border-top:2px solid #aeb8c2}
.event-top{display:flex;align-items:flex-start;gap:8px}.check-stack{display:flex;flex-direction:column;gap:5px;flex:0 0 17px;min-width:17px;padding-top:2px}.check-line{display:flex;align-items:center;width:17px;height:17px;margin:0;padding:0;cursor:pointer;font-size:0;line-height:1}.check-line span{display:none}.plan-check{appearance:auto;-webkit-appearance:checkbox;width:16px;height:16px;margin:0;cursor:pointer;accent-color:#2f6fda}.ignore-check{appearance:none;-webkit-appearance:none;position:relative;width:16px;height:16px;margin:0;border:1.5px solid #d73a49;border-radius:3px;background:#fff;cursor:pointer}.ignore-check:checked{background:#d73a49;border-color:#d73a49}.ignore-check:checked::after{content:"×";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;line-height:1}
.report-copy{white-space:pre-wrap}.report-rating{font-weight:800;margin-bottom:5px}.visit-days{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:5px}.visit-days-label{font-size:11px;color:var(--muted);font-weight:700}.visit-day{display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border:1px solid #aeb7c0;border-radius:10px;background:#fff;font-size:11px;white-space:nowrap}.visit-day input{margin:0;accent-color:#2f6fda}.event-name{font-weight:700;font-size:15px}.event-name a{color:var(--link);text-decoration:none}.event-name a:hover{text-decoration:underline}.venue{margin-top:2px;color:var(--muted);font-size:13px}.condition{font-weight:600}.rating{font-weight:700;margin-bottom:3px}.event-row.planned td:not(.date-cell){background:var(--planned)}.event-row.ignored td:not(.date-cell){background:var(--ignored)}.event-row.ignored td:not(.date-cell),.event-row.ignored td:not(.date-cell) *{color:#a2a8ae!important}.event-row.ignored td:not(.date-cell) a{text-decoration-color:#b8bdc2!important}.report-row.report-good td:not(.date-cell){background:var(--planned)}.report-row.report-bad td:not(.date-cell){background:var(--report-bad)}.event-row.calendar-focus td,.report-row.calendar-focus td{animation:calendarFlash 1.4s ease}@keyframes calendarFlash{0%,100%{background:inherit}25%,70%{background:#dff0ff}}
.calendar-panel{margin:10px 0 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.calendar-title{font-size:14px;font-weight:700}.calendar-now{font-size:12px;color:var(--muted);white-space:nowrap}.calendar-jump{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 9px}.calendar-year{border:1px solid #aeb7c0;border-radius:7px;padding:6px 8px;background:#fff;font:inherit;font-size:13px;font-weight:700}.month-jump{display:flex;gap:4px;flex-wrap:wrap}.month-jump button{min-width:38px;padding:5px 7px;font-size:12px}.month-jump button.active{background:#2f6fda;color:#fff;border-color:#2f6fda}.calendar-slider{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:stretch}.calendar-arrow{align-self:stretch;min-width:34px;padding:0 7px;font-size:24px;font-weight:700}.calendars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.month-card{min-width:0;border:1px solid #e1e5e9;border-radius:8px;padding:7px 8px 8px;background:#fff}.month-name{text-align:center;font-size:13px;font-weight:700;margin-bottom:4px;cursor:pointer}.month-name:hover{text-decoration:underline;color:var(--link)}.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11px}.weekday{color:var(--muted);font-weight:600;padding:2px 0}.day{position:relative;width:26px;height:26px;min-width:26px;min-height:26px;justify-self:center;display:flex;align-items:center;justify-content:center;border-radius:50%;user-select:none}.day.empty{visibility:hidden}.day.event-day{background:#8a939c;color:#fff;font-weight:700;cursor:pointer}.day.planned-day{background:#2f6fda;color:#fff;font-weight:700;cursor:pointer}.day.today::after{content:"";position:absolute;inset:1px;border:2px solid #111;border-radius:50%;pointer-events:none}.day.event-day:hover,.day.planned-day:hover{filter:brightness(.92)}
.loading{padding:28px;text-align:center;color:var(--muted)}.back-to-top{position:fixed;right:22px;bottom:22px;width:48px;height:48px;border-radius:50%;border:0;background:#20262d;color:#fff;font-size:26px;font-weight:800;line-height:1;box-shadow:0 3px 12px rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;z-index:50;padding:0}.back-to-top:hover{background:#111820}.back-to-top.show{display:flex}
@media(max-width:800px){.calendars{grid-template-columns:repeat(3,minmax(220px,1fr));overflow-x:auto;padding-bottom:3px}.calendar-panel{overflow:hidden}}@media(max-width:700px){.wrap{padding:9px}h1{font-size:18px}table{min-width:760px}tbody td,thead th{padding:8px;font-size:13px}.event-name{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>無料食事イベント 調査済み台帳 2026</h1><p class="meta">イベント一覧 / 来場予定 / 実地レポート</p></div><div id="status" class="status">読み込み中</div></div>
  <div class="toolbar"><div class="view-tabs"><button id="eventsTab" class="view-tab active">イベント一覧</button><button id="plannedTab" class="view-tab">来場予定</button><button id="reportsTab" class="view-tab">実地レポート</button></div><button id="resetFlagsBtn" class="reset-btn">チェックを初期化</button></div>
  <p id="viewHelp" class="help">上の□は「行く」、下の赤枠□は「考慮しない」です。状態はこのブラウザに自動保存されます。</p>
  <section class="calendar-panel" aria-label="共通カレンダー"><div class="calendar-head"><div id="calendarTitle" class="calendar-title">共通カレンダー</div><div id="calendarNow" class="calendar-now"></div></div><div class="calendar-jump"><select id="calendarYearSelect" class="calendar-year" aria-label="年を選択"></select><div id="calendarMonthButtons" class="month-jump" aria-label="月を選択"></div></div><div class="calendar-slider"><button id="calendarPrev" class="calendar-arrow" type="button" aria-label="前の月">‹</button><div id="calendarMonths" class="calendars"></div><button id="calendarNext" class="calendar-arrow" type="button" aria-label="次の月">›</button></div></section>
  <div id="eventSubtabs" class="subtabs"><button class="subtab active" data-kind="exhibition">展示会</button><button class="subtab" data-kind="gathering">懇親会</button><button class="subtab" data-kind="both">両方</button></div>
  <section id="eventsView"><div class="table-wrap"><table><colgroup><col class="date"><col class="event"><col class="cond"><col class="eval"></colgroup><thead><tr><th class="date-head">日</th><th>イベント / 会場</th><th>参加条件</th><th>評価 / 内容・根拠</th></tr></thead><tbody id="ledgerBody"><tr><td colspan="4" class="loading">イベント一覧を読み込んでいます…</td></tr></tbody></table></div></section>
  <section id="reportsView" hidden><div class="table-wrap"><table><colgroup><col class="report-date"><col class="report-event"><col class="report-text"></colgroup><thead><tr><th class="date-head">日付</th><th>イベント / 会場</th><th>レポート</th></tr></thead><tbody id="reportBody"><tr><td colspan="3" class="loading">実地レポートを読み込んでいます…</td></tr></tbody></table></div></section>
  <p class="note">※ 懇親会は「イベント一覧.json」、展示会は「展示会一覧.json」、参加後の記録は「実地レポート.json」から読み込んでいます。</p>
</div>
<button id="backToTop" class="back-to-top" type="button" aria-label="ページ上部へ戻る">↑</button>
<script>
const FLAGS_KEY='free_food_event_ledger_2026_flags_v2';
const PLANNED_KEY='free_food_event_ledger_2026_planned_v1';
const REPORT_FLAGS_KEY='free_food_event_report_flags_v1';
const UI_STATE_KEY='free_food_event_ui_state_v1';

const tbody=document.getElementById('ledgerBody');
const reportBody=document.getElementById('reportBody');
const status=document.getElementById('status');
const calendarMonths=document.getElementById('calendarMonths');
const calendarNow=document.getElementById('calendarNow');
const calendarTitle=document.getElementById('calendarTitle');
const calendarYearSelect=document.getElementById('calendarYearSelect');
const calendarMonthButtons=document.getElementById('calendarMonthButtons');
const calendarPrev=document.getElementById('calendarPrev');
const calendarNext=document.getElementById('calendarNext');
const resetFlagsBtn=document.getElementById('resetFlagsBtn');
const eventsTab=document.getElementById('eventsTab');
const plannedTab=document.getElementById('plannedTab');
const reportsTab=document.getElementById('reportsTab');
const eventSubtabs=document.getElementById('eventSubtabs');
const eventsView=document.getElementById('eventsView');
const reportsView=document.getElementById('reportsView');
const viewHelp=document.getElementById('viewHelp');
const backToTop=document.getElementById('backToTop');

let gatherings=[];
let exhibitions=[];
let reports=[];
let flags={};
let reportFlags={};
let currentView='events';
let currentKind='exhibition';
const calendarToday=new Date();
let calendarBaseYear=calendarToday.getFullYear();
let calendarBaseMonth=calendarToday.getMonth()+1;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseISO(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)}
function jpWeekday(d){return ['日','月','火','水','木','金','土'][d.getDay()]}
function dateLabel(s){const d=parseISO(s);return `${d.getMonth()+1}/${d.getDate()}(${jpWeekday(d)})`}
function weekRangeLabel(s){const d=parseISO(s),day=(d.getDay()+6)%7;const mon=new Date(d);mon.setDate(d.getDate()-day);const sun=new Date(mon);sun.setDate(mon.getDate()+6);return `${mon.getMonth()+1}/${mon.getDate()}～${sun.getMonth()+1}/${sun.getDate()}`}
function weekKey(s){const d=parseISO(s),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().slice(0,10)}
function cleanDateText(s){return String(s||'').replace(/\t/g,' ').trim()}
function eventDateText(e){return cleanDateText(e.dateText)||dateLabel(e.date)}
function eventRangeKey(e){return [e.date,e.endDate||'',eventDateText(e)].join('|')}
function isoDays(start,end){
  const out=[],a=parseISO(start),b=parseISO(end||start);
  for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
  return out;
}
function eventContainsDate(e,date){return date>=e.date&&date<=(e.endDate||e.date)}
function reportDates(r){return Array.isArray(r.visitDates)&&r.visitDates.length?r.visitDates:[r.date]}
function reportDateKey(r){return reportDates(r).join('|')}
function isMultiDay(e){return !!e.endDate&&e.endDate!==e.date}
function plannedDates(e){
  const f=eventFlag(e.id);
  if(Array.isArray(f.visitDates))return [...new Set(f.visitDates)].filter(d=>eventContainsDate(e,d)).sort();
  if(f.planned)return [e.date];
  return [];
}
function isEventPlanned(e){return plannedDates(e).length>0}
function eventById(id){return taggedEvents().find(e=>e.id===id)}
function expandEventRows(e,dates){
  const allDays=isoDays(e.date,e.endDate||e.date);
  return dates.map(d=>({...e,_displayDate:d,_dayIndex:allDays.indexOf(d)+1,_dayCount:allDays.length}));
}
function displayEventName(e){return e._dayCount>1?e.name+'（'+e._dayIndex+'）':e.name}
function rowAttendance(e,displayDate){
  if(e.attendanceStatus==='not_attended')return 'not_attended';
  if(e.attendanceStatus==='attended')return Array.isArray(e.visitDates)&&e.visitDates.includes(displayDate)?'attended':'not_attended';
  return '';
}
function shortDayLabel(iso){const d=parseISO(iso);return d.getDate()+'('+jpWeekday(d)+')'}
function visitDayControls(e){
  if(!isMultiDay(e))return '';
  const selected=new Set(plannedDates(e));
  return '<div class="visit-days"><span class="visit-days-label">行く日</span>'+
    isoDays(e.date,e.endDate).map(d=>'<label class="visit-day"><input class="day-plan-check" type="checkbox" data-day="'+esc(d)+'" '+(selected.has(d)?'checked':'')+'>'+esc(shortDayLabel(d))+'</label>').join('')+
    '</div>';
}

function loadFlags(){
  try{flags=JSON.parse(localStorage.getItem(FLAGS_KEY)||'{}')}catch(e){flags={}}
  try{reportFlags=JSON.parse(localStorage.getItem(REPORT_FLAGS_KEY)||'{}')}catch(e){reportFlags={}}
}
function loadUiState(){
  try{
    const saved=JSON.parse(localStorage.getItem(UI_STATE_KEY)||'{}');
    if(['events','planned','reports'].includes(saved.view))currentView=saved.view;
    if(['exhibition','gathering','both'].includes(saved.kind))currentKind=saved.kind;
  }catch(e){}
}
function saveUiState(){
  localStorage.setItem(UI_STATE_KEY,JSON.stringify({view:currentView,kind:currentKind}));
}
function saveFlags(){
  localStorage.setItem(FLAGS_KEY,JSON.stringify(flags));
  status.textContent='行く／除外チェックを保存しました';
  status.className='status save-ok';
  renderCalendar();
}
function saveReportFlags(){
  localStorage.setItem(REPORT_FLAGS_KEY,JSON.stringify(reportFlags));
  status.textContent='実地レポートの評価チェックを保存しました';
  status.className='status save-ok';
}
function eventFlag(id){return flags[id]||{planned:false,ignored:false}}
function reportFlag(id){return reportFlags[id]||{good:false,bad:false}}

function taggedEvents(){
  return [
    ...gatherings.map(e=>({...e,_kind:'gathering'})),
    ...exhibitions.map(e=>({...e,_kind:'exhibition'}))
  ];
}
function startMinutes(e){
  const m=String(e.nightTime||e.startTime||'').match(/(\d{1,2}):(\d{2})/);
  return m?Number(m[1])*60+Number(m[2]):9999;
}
function eventCompare(a,b){
  const ad=a._displayDate||a.date,bd=b._displayDate||b.date;
  const d=ad.localeCompare(bd);
  if(d)return d;
  if(currentKind==='both'){
    if(a._kind!==b._kind)return a._kind==='exhibition'?-1:1;
    if(a._kind==='gathering'){
      const t=startMinutes(a)-startMinutes(b);
      if(t)return t;
    }
  }else if(a._kind==='gathering'){
    const t=startMinutes(a)-startMinutes(b);
    if(t)return t;
  }
  return a.name.localeCompare(b.name,'ja');
}
function visibleEvents(){
  let list=taggedEvents();
  if(currentKind!=='both')list=list.filter(e=>e._kind===currentKind);
  list=list.flatMap(e=>{
    const days=currentView==='planned'?plannedDates(e):isoDays(e.date,e.endDate||e.date);
    return expandEventRows(e,days);
  });
  return list.sort(eventCompare);
}

function renderLedger(){
  const sorted=visibleEvents();
  let html='',currentWeek='',currentDate='',i=0;
  while(i<sorted.length){
    const e=sorted[i],displayDate=e._displayDate||e.date,wk=weekKey(displayDate);
    if(wk!==currentWeek){
      html+=`<tr class="week-row"><td colspan="4">${esc(weekRangeLabel(displayDate))}</td></tr>`;
      currentWeek=wk;currentDate='';
    }
    const sameDate=sorted.filter(x=>(x._displayDate||x.date)===displayDate),firstOfDate=displayDate!==currentDate;
    const f=eventFlag(e.id),selected=plannedDates(e).includes(displayDate),historyStatus=rowAttendance(e,displayDate),cls=`event-row${selected?' planned':''}${f.ignored?' ignored':''}`;
    html+=`<tr class="${cls}" data-date="${esc(displayDate)}" data-display-date="${esc(displayDate)}" data-event-id="${esc(e.id)}">`;
    if(firstOfDate)html+=`<td class="date-cell" rowspan="${sameDate.length}"><strong>${esc(dateLabel(displayDate))}</strong></td>`;
    const badge=currentKind==='both'?`<span class="kind-badge ${e._kind}">${e._kind==='exhibition'?'展示会':'懇親会'}</span>`:'';
    const resultBadge=historyStatus?`<span class="attendance-badge ${historyStatus==='attended'?'attended':'not-attended'}">${historyStatus==='attended'?'✓ 参加':'× 未参加'}</span>`:'';
    const shownName=displayEventName(e);
    const nameHtml=e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(shownName)}</a>`:esc(shownName);
    const planBox=historyStatus?'':`<label class="check-line"><input class="plan-check" type="checkbox" aria-label="行く" data-day="${esc(displayDate)}" ${selected?'checked':''}><span>行く</span></label>`;
    const ignoreBox=historyStatus?'':`<label class="check-line"><input class="ignore-check" type="checkbox" aria-label="考慮しない" ${f.ignored?'checked':''}><span>×</span></label>`;
    html+=`<td class="event-cell"><div class="event-top"><div class="check-stack">${planBox}${ignoreBox}</div><div>${resultBadge}${badge}<div class="event-name">${nameHtml}</div><div class="venue">${esc(e.venue)}</div>${historyStatus?'':visitDayControls(e)}</div></div></td>`;
    html+=`<td class="condition">${(e.conditionLines||[]).map(esc).join('<br>')}</td>`;
    html+=`<td><div class="rating">${esc(e.rating||'')}</div><div class="night">${e.nightTime?`<strong>${esc(e.nightTime)}</strong> `:''}${esc(e.nightText||e.detailText||'')}</div></td></tr>`;
    currentDate=displayDate;i++;
  }
  const emptyText=currentView==='planned'?'「行く」にチェックしたイベントはありません。':'該当するイベントはありません。';
  tbody.innerHTML=html||`<tr><td colspan="4" class="loading">${emptyText}</td></tr>`;
}

function renderReports(){
  const sorted=[...reports].sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name,'ja'));
  let html='',currentReportDate='',i=0;
  while(i<sorted.length){
    const r=sorted[i],rkey=reportDateKey(r),sameDate=sorted.filter(x=>reportDateKey(x)===rkey),firstOfDate=rkey!==currentReportDate,f=reportFlag(r.id);
    const cls=`report-row${f.good?' report-good':''}${f.bad?' report-bad':''}`;
    html+=`<tr class="${cls}" data-date="${esc(r.date)}" data-visit-dates="${esc(reportDates(r).join(","))}" data-report-id="${esc(r.id)}">`;
    if(firstOfDate){const dt=esc(cleanDateText(r.dateText)||dateLabel(r.date)).replace(/\n/g,"<br>");html+=`<td class="date-cell" rowspan="${sameDate.length}"><strong>${dt}</strong></td>`;}
    const nameHtml=r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a>`:esc(r.name);
    html+=`<td class="event-cell"><div class="event-top"><div class="check-stack"><label class="check-line"><input class="plan-check" type="checkbox" aria-label="良かった" ${f.good?'checked':''}><span>良</span></label><label class="check-line"><input class="ignore-check" type="checkbox" aria-label="良くなかった" ${f.bad?'checked':''}><span>×</span></label></div><div><div class="event-name">${nameHtml}</div><div class="venue">${esc(r.venue)}</div></div></div></td>`;
    html+=`<td>${r.rating?`<div class="report-rating">評価：${esc(r.rating)}</div>`:""}<div class="report-copy">${esc(r.report)}</div></td></tr>`;
    currentReportDate=rkey;i++;
  }
  reportBody.innerHTML=html||'<tr><td colspan="3" class="loading">実地レポートはまだありません。</td></tr>';
}

function eventStatusMap(){
  const map=new Map();
  for(const e of taggedEvents()){
    const selected=new Set(plannedDates(e));
    for(const day of isoDays(e.date,e.endDate||e.date)){
      const prev=map.get(day)||{exists:true,planned:false};
      map.set(day,{exists:true,planned:prev.planned||selected.has(day)});
    }
  }
  return map;
}
function reportStatusMap(){
  const map=new Map();
  for(const r of reports)for(const day of reportDates(r))map.set(day,{exists:true});
  return map;
}

function buildMonthCard(year,month,map,reportMode){
  const first=new Date(year,month-1,1),days=new Date(year,month,0).getDate(),now=new Date(),labels=['日','月','火','水','木','金','土'];
  const card=document.createElement('div');
  card.className='month-card';
  card.innerHTML=`<div class="month-name" title="${year}年${month}月の先頭へ移動">${year}年${month}月</div>`;
  card.querySelector('.month-name').onclick=()=>scrollToMonth(year,month);
  const grid=document.createElement('div');grid.className='month-grid';
  labels.forEach(w=>{const el=document.createElement('div');el.className='weekday';el.textContent=w;grid.appendChild(el)});
  for(let j=0;j<first.getDay();j++){const el=document.createElement('div');el.className='day empty';grid.appendChild(el)}
  for(let day=1;day<=days;day++){
    const el=document.createElement('div');el.className='day';el.textContent=day;
    const key=`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`,st=map.get(key);
    if(reportMode){
      if(st?.exists){
        el.classList.add('planned-day');el.title='実地レポートあり';el.onclick=()=>scrollToDate(key);
      }
    }else{
      if(st?.exists)el.classList.add('event-day');
      if(st?.planned)el.classList.add('planned-day');
      const clickable=currentView==='planned'?!!st?.planned:!!st?.exists;
      if(clickable){
        el.title=st.planned?'来場予定あり':'イベントあり';
        el.onclick=()=>scrollToDate(key);
      }else if(st?.exists){
        el.title='イベントあり';
      }
    }
    if(year===now.getFullYear()&&month===now.getMonth()+1&&day===now.getDate())el.classList.add('today');
    grid.appendChild(el);
  }
  card.appendChild(grid);return card;
}

function availableCalendarYears(){
  const years=new Set([calendarToday.getFullYear(),calendarBaseYear]);
  if(currentView==='reports'){
    reports.forEach(r=>reportDates(r).forEach(d=>years.add(Number(String(d).slice(0,4)))));
  }else{
    taggedEvents().forEach(e=>{
      years.add(Number(String(e.date).slice(0,4)));
      if(e.endDate)years.add(Number(String(e.endDate).slice(0,4)));
    });
  }
  return [...years].filter(Number.isFinite).sort((a,b)=>a-b);
}
function renderCalendarJump(){
  const years=availableCalendarYears();
  calendarYearSelect.innerHTML=years.map(y=>`<option value="${y}" ${y===calendarBaseYear?'selected':''}>${y}</option>`).join('');
  calendarMonthButtons.innerHTML=Array.from({length:12},(_,i)=>{
    const m=i+1;
    return `<button type="button" data-month="${m}" class="${m===calendarBaseMonth?'active':''}">${m}月</button>`;
  }).join('');
}
function setCalendarBase(year,month,scroll=false){
  const d=new Date(year,month-1,1);
  calendarBaseYear=d.getFullYear();
  calendarBaseMonth=d.getMonth()+1;
  renderCalendar();
  if(scroll)scrollToMonth(calendarBaseYear,calendarBaseMonth);
}
function renderCalendar(){
  const now=calendarToday;calendarMonths.innerHTML='';
  const map=currentView==='reports'?reportStatusMap():eventStatusMap();
  calendarTitle.textContent=currentView==='reports'?'実地レポートカレンダー':'共通カレンダー';
  calendarNow.textContent=currentView==='reports'?(`実地レポート：${reports.length}件`):(`青＝来場予定　PC日時：${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`);
  renderCalendarJump();
  for(let offset=0;offset<3;offset++){
    const d=new Date(calendarBaseYear,calendarBaseMonth-1+offset,1);
    calendarMonths.appendChild(buildMonthCard(d.getFullYear(),d.getMonth()+1,map,currentView==='reports'));
  }
}

function scrollToMonth(year,month){
  const prefix=`${year}-${String(month).padStart(2,'0')}`;
  const body=currentView==='reports'?reportBody:tbody,selector=currentView==='reports'?'.report-row':'.event-row';
  const row=[...body.querySelectorAll(selector)].find(r=>{
    if(currentView==='reports')return String(r.dataset.visitDates||r.dataset.date).split(',').some(d=>d.startsWith(prefix));
    return String(r.dataset.displayDate||'').startsWith(prefix);
  });
  if(!row)return;
  row.scrollIntoView({behavior:'smooth',block:'start'});
  row.classList.remove('calendar-focus');void row.offsetWidth;row.classList.add('calendar-focus');
  setTimeout(()=>row.classList.remove('calendar-focus'),1600);
}
function scrollToDate(date){
  const body=currentView==='reports'?reportBody:tbody,selector=currentView==='reports'?'.report-row':'.event-row';
  const row=[...body.querySelectorAll(selector)].find(r=>{
    if(currentView==='reports')return String(r.dataset.visitDates||r.dataset.date).split(',').includes(date);
    return r.dataset.displayDate===date;
  });if(!row)return;
  row.scrollIntoView({behavior:'smooth',block:'start'});
  row.classList.remove('calendar-focus');void row.offsetWidth;row.classList.add('calendar-focus');
  setTimeout(()=>row.classList.remove('calendar-focus'),1600);
}
function applyFlagToRow(row){
  const id=row.dataset.eventId,f=eventFlag(id);
  row.classList.toggle('planned',!!f.planned);
  row.classList.toggle('ignored',!!f.ignored);
}
function applyReportFlagToRow(row){
  const id=row.dataset.reportId,f=reportFlag(id);
  row.classList.toggle('report-good',!!f.good);
  row.classList.toggle('report-bad',!!f.bad);
}

function updateSubtabs(){
  eventSubtabs.querySelectorAll('.subtab').forEach(b=>b.classList.toggle('active',b.dataset.kind===currentKind));
}
function setView(view,persist=true){
  currentView=view;
  const isReports=view==='reports';
  eventsView.hidden=isReports;
  reportsView.hidden=!isReports;
  eventSubtabs.hidden=isReports;
  eventsTab.classList.toggle('active',view==='events');
  plannedTab.classList.toggle('active',view==='planned');
  reportsTab.classList.toggle('active',isReports);
  updateSubtabs();

  if(isReports){
    viewHelp.textContent='上の□は良かったイベント、下の赤枠□は良くなかったイベントです。これらのチェックはカレンダーには影響しません。';
  }else if(view==='planned'){
    viewHelp.textContent='来場予定だけを表示します。複数日イベントも日ごとに別行で表示し、チェックした日の行だけ残ります。「両方」では同じ日を展示会→懇親会の順にします。';
  }else{
    viewHelp.textContent='左上の□はその日の「行く」、下の赤枠□は「考慮しない」です。複数日イベントは日別行に加え、会場名の下の「行く日」からも日付を選べます。どちらも同じ予定に同期します。';
  }
  if(!isReports)renderLedger();
  renderCalendar();
  if(persist)saveUiState();
}

window.addEventListener('scroll',()=>backToTop.classList.toggle('show',window.scrollY>500),{passive:true});
backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

calendarPrev.addEventListener('click',()=>setCalendarBase(calendarBaseYear,calendarBaseMonth-1,false));
calendarNext.addEventListener('click',()=>setCalendarBase(calendarBaseYear,calendarBaseMonth+1,false));
calendarYearSelect.addEventListener('change',()=>setCalendarBase(Number(calendarYearSelect.value),calendarBaseMonth,true));
calendarMonthButtons.addEventListener('click',e=>{
  const b=e.target.closest('button[data-month]');if(!b)return;
  setCalendarBase(calendarBaseYear,Number(b.dataset.month),true);
});

tbody.addEventListener('change',e=>{
  if(!e.target.classList.contains('plan-check')&&!e.target.classList.contains('day-plan-check')&&!e.target.classList.contains('ignore-check'))return;
  const row=e.target.closest('.event-row');if(!row)return;
  const id=row.dataset.eventId,f=eventFlag(id),ev=eventById(id);if(!ev)return;
  if(e.target.classList.contains('plan-check')||e.target.classList.contains('day-plan-check')){
    const set=new Set(plannedDates(ev)),day=e.target.dataset.day||row.dataset.displayDate;
    if(e.target.checked)set.add(day);else set.delete(day);
    f.visitDates=[...set].sort();f.planned=f.visitDates.length>0;
    if(f.planned)f.ignored=false;
  }else{
    f.ignored=e.target.checked;
    if(f.ignored){f.planned=false;f.visitDates=[];}
  }
  flags[id]=f;
  saveFlags();
  renderLedger();
});

reportBody.addEventListener('change',e=>{
  if(!e.target.classList.contains('plan-check')&&!e.target.classList.contains('ignore-check'))return;
  const row=e.target.closest('.report-row');if(!row)return;
  const id=row.dataset.reportId,f=reportFlag(id);
  if(e.target.classList.contains('plan-check')){
    f.good=e.target.checked;if(f.good)f.bad=false;
  }else{
    f.bad=e.target.checked;if(f.bad)f.good=false;
  }
  reportFlags[id]=f;
  row.querySelector('.plan-check').checked=!!f.good;
  row.querySelector('.ignore-check').checked=!!f.bad;
  applyReportFlagToRow(row);
  saveReportFlags();
});

eventsTab.onclick=()=>setView('events');
plannedTab.onclick=()=>{currentKind='both';setView('planned');};
reportsTab.onclick=()=>setView('reports');
eventSubtabs.addEventListener('click',e=>{
  const b=e.target.closest('.subtab');if(!b)return;
  currentKind=b.dataset.kind;
  updateSubtabs();
  renderLedger();
  saveUiState();
});

resetFlagsBtn.onclick=()=>{
  if(currentView==='reports'){
    if(!confirm('実地レポートの「良かった／良くなかった」チェックをすべて外しますか？'))return;
    reportFlags={};localStorage.removeItem(REPORT_FLAGS_KEY);
    renderReports();renderCalendar();
    status.textContent='実地レポートのチェックを初期化しました';status.className='status save-warn';
  }else{
    if(!confirm('懇親会・展示会の「行く／考慮しない」チェックをすべて外しますか？'))return;
    flags={};localStorage.removeItem(FLAGS_KEY);localStorage.removeItem(PLANNED_KEY);
    renderLedger();renderCalendar();
    status.textContent='イベントのチェックを初期化しました';status.className='status save-warn';
  }
};

(async()=>{
  try{
    loadFlags();
    loadUiState();
    const [gr,xr,rr]=await Promise.all([
      fetch(`イベント一覧.json?v=${Date.now()}`,{cache:'no-store'}),
      fetch(`展示会一覧.json?v=${Date.now()}`,{cache:'no-store'}),
      fetch(`実地レポート.json?v=${Date.now()}`,{cache:'no-store'})
    ]);
    if(!gr.ok)throw new Error('イベント一覧.jsonの取得に失敗');
    if(!xr.ok)throw new Error('展示会一覧.jsonの取得に失敗');
    if(!rr.ok)throw new Error('実地レポート.jsonの取得に失敗');
    const [gatherData,exhibitData,reportData]=await Promise.all([gr.json(),xr.json(),rr.json()]);
    gatherings=Array.isArray(gatherData.events)?gatherData.events:[];
    exhibitions=Array.isArray(exhibitData.events)?exhibitData.events:[];
    reports=Array.isArray(reportData.reports)?reportData.reports:[];
    const reportFiles=(Array.isArray(reportData.reportFiles)&&reportData.reportFiles.length)?reportData.reportFiles:[
      '実地レポート/2026-01-03.json',
      '実地レポート/2026-04.json',
      '実地レポート/2026-05.json',
      '実地レポート/2026-06.json',
      '実地レポート/2026-07.json',
      '実地レポート/2026-08.json',
      '実地レポート/2026-09.json'
    ];
    if(reportFiles.length){
      const parts=await Promise.all(reportFiles.map(async p=>{
        const r=await fetch(`${p}?v=${Date.now()}`,{cache:'no-store'});
        if(!r.ok)throw new Error(`${p}の取得に失敗`);
        return r.json();
      }));
      reports=parts.flatMap(x=>Array.isArray(x.reports)?x.reports:[]);
    }
    renderReports();
    setView(currentView,false);
    status.textContent=`読込完了：懇親会${gatherings.length}件 / 展示会${exhibitions.length}件 / レポート${reports.length}件`;
    status.className='status save-ok';
  }catch(err){
    console.error(err);
    tbody.innerHTML='<tr><td colspan="4" class="loading">台帳の読み込みに失敗しました。ページを再読み込みしてください。</td></tr>';
    reportBody.innerHTML='<tr><td colspan="3" class="loading">実地レポートの読み込みに失敗しました。</td></tr>';
    status.textContent='読み込み失敗';status.className='status save-warn';
  }
})();
setInterval(()=>{if(gatherings.length||exhibitions.length||reports.length)renderCalendar()},60000);
</script>
</body>
</html>
